<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Good Boy Bobo</title><script src="audio.js?v=22"></script><script src="common.js?v=22"></script></head><body><div id="app" style="display:none"></div><script src="pages.js?v=22"></script><script>
buildPage({image:'settings',extra(){const P=PAGE;
 let ST={music:70,sounds:80,barks:1,vib:1,hints:1};try{Object.assign(ST,JSON.parse(localStorage.getItem('gbb_settings')||'{}'))}catch(e){}
 const sv=()=>{try{localStorage.setItem('gbb_settings',JSON.stringify(ST))}catch(e){};window.BA&&BA.apply()};
 // toggle art is cut from this page's own painted toggles (on = Music row, off = Notifications row)
 const TG=[{k:'music',y:802},{k:'sounds',y:934},{k:'vib',y:1069},{k:'notif',y:1204}];
 const isOn=t=>t.k=='notif'?false:t.k=='vib'?!!ST.vib:ST[t.k]>0;
 TG.forEach((t,i)=>{t.on=P.img(`a/pages/tg${i}_on.webp`,880,t.y,250,120);t.off=P.img(`a/pages/tg${i}_off.webp`,880,t.y,250,120);
  const show=()=>{const v=isOn(t);t.on.style.visibility=v?'visible':'hidden';t.off.style.visibility=v?'hidden':'visible'};show();
  P.hit('',[100,t.y+5,1090,115],()=>{
   if(t.k=='notif')return P.toast('Notifications coming soon!');
   if(t.k=='vib')ST.vib=ST.vib?0:1;
   else if(ST[t.k]>0){ST['_'+t.k]=ST[t.k];ST[t.k]=0}else ST[t.k]=ST['_'+t.k]||(t.k=='music'?70:80);
   sv();show();if(t.k=='vib'&&ST.vib&&navigator.vibrate)navigator.vibrate(30)})});
 [[1450,'Player profiles are coming soon!'],[1590,'Saving to the cloud is coming soon!'],[1700,'More languages are coming soon!'],[2025,'Help & Support is coming soon!'],[2155,'Privacy & Terms are coming soon!']].forEach(([y,m])=>P.hit(m,[100,y,1090,115]));
}});
</script><script>BA.music("Theme")</script></body></html>
