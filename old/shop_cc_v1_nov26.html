 border-style:solid;border-width:calc(var(--u)*14);border-image:url(../ui2/btn_cream.webp?v=1) 70 fill/calc(var(--u)*17) stretch;font-size:calc(var(--u)*18);white-space:nowrap}

 filter:drop-shadow(0 calc(var(--u)*4) calc(var(--u)*4) rgba(80,35,5,.3));display:flex;flex-direction:column;align-items:center;padding-top:calc(var(--u)*2)}
.tile .ic{height:calc(var(--u)*62);width:100%;object-fit:contain;filter:drop-shadow(0 calc(var(--u)*2) calc(var(--u)*2) rgba(80,40,0,.25))}

 display:flex;flex-direction:column;align-items:center}

<script src="../uikit/kit.js?v=23"></script>
<script>
'use strict';
const IW=852,IH=1846;
const ui=K.scene('shop/bg.jpg?v=3',IW,IH,layout);
const {h}=K;
K.topbar(ui,'settings.html');
const S=window.GBBStore,E=window.Eco;
const A='../uikit/',B3='shop3/';
const BI=['bst_paw','bst_swap','bst_bomb','bst_shuffle'],BN=['Paw Tap','Free Swap','Bomb','Shuffle'];
const sc=h('div','',ui);sc.id='shopScroll';const col=h('div','',sc);col.id='col';
const im=(src,cls,p)=>{const i=h('img',cls,p);i.src=src;i.alt='';i.draggable=false;return i};
const paint=(el,txt,style)=>{el.textContent=txt;if(window.GBBFont)GBBFont.bind(el,style)};
const fmtN=n=>n.toLocaleString('en-US');
const durTxt=ms=>S.dur(ms);
// ---- one item inside a card: picture + number underneath
function item(p,kind,v){const d=h('div','it',p);
 if(kind==='bones'){im(B3+'bones'+v.art+'.webp?v=1','ic'+(v.big?' big':''),d);paint(h('div','num',d),fmtN(v.n),'ink')}
 if(kind==='boost'){const g=h('div','bst4',d);BI.forEach(b=>im(A+b+'.webp?v=1','',g));paint(h('div','num',d),'×'+v,'ink')}
 if(kind==='hearts'){const f=h('div','inf',d);im(A+'ic_heart.webp?v=1','',f);h('span','',f).textContent='∞';
  const n=h('div','num',d);im(A+'ic_stopwatch.webp?v=1','tm',n);const t=h('span','',n);paint(t,durTxt(v),'ink')}
 return d}
function priceBtn(p,prod,el){const b=K.button('green_med',prod.price,()=>buy(prod,el),{aria:'Buy '+(prod.name||fmtN(prod.bones)+' bones')+' for '+prod.price});b.classList.add('pb');p.appendChild(b);
 const l=b.querySelector('.k-lbl');if(l&&window.GBBFont){l.style.textShadow='none';GBBFont.bind(l,'button',.78)}return b}
function buy(prod,el){S.buy(prod.id,(ok,p,msg)=>{if(ok){el.classList.remove('got');void el.offsetWidth;el.classList.add('got');try{BA.play('win',{gap:200})}catch(e){}
  const bits=[];if(p.bones)bits.push(fmtN(p.bones)+' bones');if(p.boost)bits.push(p.boost+' of each booster');if(p.hearts)bits.push(durTxt(p.hearts)+' unlimited hearts');K.toast('Added: '+bits.join(', ')+'!');render()}
  else if(msg)K.toast(msg)})}
// ---- deal / bundle card (Candy Crush style: items panel on top, name bottom-left, price bottom-right)
function card(prod,color){const c=h('div','card '+color,col);const inn=h('div','inner',c);
 if(prod.bones)item(inn,'bones',{n:prod.bones,art:prod.kind==='bundle'?{500:3,1100:4,2400:5,6500:6}[prod.bones]:prod.kind==='weekly'?2:3,big:prod.kind!=='bundle'||prod.bones>=2400});
 if(prod.boost)item(inn,'boost',prod.boost);
 if(prod.hearts)item(inn,'hearts',prod.hearts);
 const ft=h('div','foot',c);const nm=h('div','nm',ft);if(prod.name.length>14)nm.style.fontSize='calc(var(--u)*21)';paint(nm,prod.name,'title');
 if(S.bought(prod.id)){const s=h('div','sold',ft);s.dataset.id=prod.id;s.textContent=(prod.kind==='daily'?'New deal in ':'Back in ')+S.fmt(prod.kind==='daily'?S.dailyLeft():S.weeklyLeft())}
 else priceBtn(ft,prod,c);
 if(prod.kind==='weekly'){const t=h('div','tag off',c);paint(t,prod.tag,'badge')}
 if(prod.kind==='daily'){const t=h('div','tag pop',c);paint(t,prod.tag,'badge');const tm=h('div','timer',c);im(A+'ic_stopwatch.webp?v=1','',tm);const tt=h('span','t',tm);tt.dataset.daily=1;paint(tt,S.fmt(S.dailyLeft()),'ink');c.style.marginTop='calc(var(--u)*30)'}
 return c}
function header(txt){const p=h('div','k-plate hdr',col);paint(p,txt,'ink')}
function render(){col.textContent='';
 im('../ui3/shop2/title.webp?v=5','ttl',col);
 const P=S.products;
 card(P.find(p=>p.kind==='weekly'),'yellow');
 card(P.find(p=>p.kind==='daily'),'peach');
 header('Bundles');
 for(const p of P.filter(p=>p.kind==='bundle'))card(p,p.card);
 header('Bones');
 const g=h('div','grid',col);
 for(const p of P.filter(p=>p.kind==='bones')){const t=h('div','tile',g);im(B3+'bones'+p.art+'.webp?v=1','ic',t);paint(h('div','num',t),fmtN(p.bones),'ink');priceBtn(t,p,t)}
 header('Boosters');
 const bg=h('div','bgrid',col);
 BI.forEach((b,k)=>{const t=h('div','btile',bg);const pic=im(A+b+'.webp?v=1','ic',t);paint(h('div','bn',t),BN[k],'ink');
  const price=E.PRICE.boost[k];const btn=K.button('green_med',String(price),()=>{
   if(!E.spend(price)){K.toast('You need '+price+' bones. You have '+E.bones()+'.');return}
   E.addBoost(k,1);pic.classList.remove('wob');void pic.offsetWidth;pic.classList.add('wob');K.toast(BN[k]+' added! You have '+E.boosts()[k]+'.')},{aria:'Buy one '+BN[k]+' for '+price+' bones'});
  btn.classList.add('pb');t.appendChild(btn);const l=btn.querySelector('.k-lbl');const bi=h('img','b');bi.src=A+'gold_bone.webp?v=1';btn.insertBefore(bi,l);if(l&&window.GBBFont){l.style.textShadow='none';GBBFont.bind(l,'button',.78)}});
 const r=K.button('cream_big','Restore Purchases',()=>S.restore(),{aria:'Restore Purchases'});r.classList.add('rest');col.appendChild(r)}
S.onChange=render;
render();
// keep the countdowns ticking
setInterval(()=>{col.querySelectorAll('[data-daily]').forEach(e=>{e.textContent=S.fmt(S.dailyLeft())});
 col.querySelectorAll('.sold').forEach(e=>{const p=S.byId(e.dataset.id);if(!S.bought(p.id)){render();return}e.textContent=(p.kind==='daily'?'New deal in ':'Back in ')+S.fmt(p.kind==='daily'?S.dailyLeft():S.weeklyLeft())})},30000);
function layout(I){const top=I.wu*112,bot=I.navTop-4*I.wu;Object.assign(sc.style,{top:top+'px',height:Math.max(100,bot-top)+'px'})}
K.start();
</script><script src="../nav/nav.js?v=24" data-page="shop"></script><script>window.BA&&BA.music("inside_myself")</script></body></html>
