<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Good Boy Bobo — Backyard map</title>
<style>
@font-face{font-family:Nun;src:url('../a/home/Nunito-Black.ttf')}
html,body{margin:0;height:100%;overflow:hidden;background:#0d5f5f}
#sc{position:fixed;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior:none}
#sc::-webkit-scrollbar{display:none}
.scene{position:relative;height:100vh;height:100dvh;overflow:hidden;scroll-snap-align:start}
.art{position:absolute;left:50%;transform:translateX(-50%)}
.art canvas{position:absolute;inset:0;width:100%;height:100%}
.o{position:absolute;transform:translate(-50%,-100%);pointer-events:none}
.n{position:absolute;transform:translate(-50%,-50%);font-family:Nun;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none}
#paw{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 0 10px #ffe27a) drop-shadow(0 0 4px #ffd34d) drop-shadow(0 4px 3px rgba(0,0,0,.35));animation:bob 1.2s ease-in-out infinite;pointer-events:none;z-index:3}
@keyframes bob{50%{margin-top:-6px}}
#hud{position:fixed;left:0;right:0;top:0;height:120px;pointer-events:none;z-index:5}
#hud img{position:absolute;top:calc(env(safe-area-inset-top) + 34px);height:38px}
#hud .t{position:absolute;top:calc(env(safe-area-inset-top) + 34px);height:38px;line-height:38px;font-family:Nun;font-size:22px;color:#14504e}
#tabs{position:fixed;left:0;bottom:0;width:100%;pointer-events:none;z-index:5}
.btn{position:fixed;z-index:9;font:800 14px system-ui;border:0;border-radius:14px;padding:9px 13px;color:#fff}
#win{right:10px;bottom:calc(27vw + 14px);font-size:16px;background:linear-gradient(#57c84d,#2f9a2b);box-shadow:0 4px 0 #1f6e1c}
#tog{right:10px;top:calc(env(safe-area-inset-top) + 84px);background:rgba(18,95,90,.9)}#tog.off{background:rgba(120,120,120,.9)}
#tag{position:fixed;z-index:9;left:8px;top:calc(env(safe-area-inset-top) + 86px);font:700 11px system-ui;color:#fff;background:rgba(200,40,40,.85);padding:5px 8px;border-radius:9px}
#hint{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 130px);font:800 14px system-ui;color:#fff;background:rgba(0,0,0,.45);padding:7px 12px;border-radius:14px;transition:opacity .6s}
</style></head><body>
<div id="sc"></div>
<div id="hud"><img src="L02_heart_counter.png" style="left:12px"><div class="t" style="left:68px">5</div>
<img src="L03_bone_counter.png" style="left:142px"><div class="t" style="left:198px">430</div><img src="L04_gear.png" style="right:12px"></div>
<img id="tabs" src="tabs.png?v=1">
<button class="btn" id="tog">Motion: ON</button><button class="btn" id="win">Win level ▶</button>
<div id="tag">CHAPTERS 1–4 · levels 1–40</div><div id="hint">Swipe up to explore ↑</div>
<script>
'use strict';

// level spots per scene (image fractions): [x, y, button width]
const SCENES=[
 {dir:'s1',gate:[.535,.44],IW:852,IH:1846,CH:775,spots:[[.53,.80,.21],[.455,.705,.17],[.565,.625,.14],[.51,.555,.115],[.527,.49,.095]],tw:[[.03,.84],[.08,.87],[.86,.79],[.93,.77],[.9,.93],[.98,.47],[.34,.45],[.12,.46]]},
 {dir:'s2',gate:[.44,.34],IW:934,IH:1684,CH:505,spots:[[.50,.86,.2],[.43,.725,.17],[.235,.625,.14],[.465,.50,.115],[.36,.44,.095]],tw:[[.03,.93],[.11,.92],[.9,.96],[.93,.69],[.75,.47],[.6,.58],[.05,.52]]},
 {dir:'s3',gate:[.5,.36],IW:852,IH:1846,CH:553,spots:[[.5,.80,.2],[.45,.70,.17],[.52,.605,.14],[.555,.515,.115],[.48,.44,.095]],tw:[[.03,.88],[.08,.9],[.95,.86],[.9,.53],[.06,.4],[.23,.43],[.72,.45]]},
 {dir:'s4',gate:[.27,.27],IW:852,IH:1846,CH:553,spots:[[.42,.775,.2],[.375,.69,.17],[.45,.60,.14],[.52,.515,.115],[.44,.445,.095]],tw:[[.03,.72],[.08,.74],[.95,.77],[.9,.42],[.05,.55],[.2,.3],[.4,.32]]},
 {dir:'s5',gate:[.13,.31],IW:852,IH:1846,CH:553,spots:[[.62,.80,.2],[.6,.69,.17],[.56,.605,.14],[.45,.495,.115],[.24,.415,.095]],tw:[[.05,.79],[.1,.81],[.95,.5],[.9,.47],[.02,.42],[.13,.27]]},
 {dir:'s6',gate:[.74,.31],IW:852,IH:1846,CH:553,spots:[[.45,.84,.2],[.4,.71,.17],[.41,.60,.14],[.5,.515,.115],[.57,.43,.095]],tw:[[.06,.85],[.12,.88],[.94,.83],[.3,.04],[.8,.02],[.37,.36]]},
 {dir:'s7',gate:[.88,.28],rain:1,IW:852,IH:1846,CH:369,spots:[[.5,.82,.2],[.47,.70,.17],[.47,.605,.14],[.49,.515,.115],[.53,.445,.09]],tw:[[.05,.72],[.97,.7],[.06,.28],[.7,.15]]},
 {dir:'s8',gate:[.5,.33],rain:.4,IW:852,IH:1846,CH:461,spots:[[.55,.83,.2],[.63,.72,.17],[.6,.615,.14],[.57,.535,.115],[.39,.465,.09]],tw:[[.86,.42],[.9,.41],[.78,.27],[.95,.6],[.06,.92]]}];
const FS=`precision highp float;varying vec2 uv;uniform sampler2D tB,tM,tS,tC,tR;uniform float t,on,chf;uniform vec2 px;
void main(){vec4 m=texture2D(tM,uv);vec2 d=vec2(0.);
 float wind=.72+.28*sin(t*.31)+.35*max(0.,sin(t*.17+1.))*max(0.,sin(t*.9));
 float ph=uv.x*2.4;float sway=.78*sin(t*1.2+ph)+.22*sin(t*2.6+ph*2.3);
 d.x+=m.r*px.x*17.*sway*wind;d.y+=m.r*px.y*3.*sin(t*1.2+ph+1.3)*wind;
 float gust=exp(-pow(uv.x*.55+uv.y*1.1-fract(t*.09)*2.4+.5,2.)/.02);
 float blade=sin(uv.x*14.-t*2.2+uv.y*20.);
 d.x+=m.g*px.x*(2.+3.5*gust)*blade*wind;
 d.x+=m.b*px.x*6.*sin(t*1.8+uv.x*20.+uv.y*12.)*wind;
 d*=on;vec3 c=texture2D(tB,uv-d).rgb;
 c+=m.g*gust*vec3(.08,.10,.03)*on;c+=m.r*(sway*.022)*vec3(1.,1.,.6)*on;
 if(uv.y<chf){vec3 sky=texture2D(tS,vec2(uv.x,uv.y/chf)).rgb;vec3 clean=mix(c,sky,texture2D(tR,vec2(uv.x,uv.y/chf)).r*m.a);
  vec4 c1=texture2D(tC,vec2(fract(uv.x-t*.012*on),uv.y/chf));c=mix(clean,c1.rgb,c1.a*m.a);}
 float r=length((uv-vec2(.0,.23))*vec2(1.,2.2));c+=vec3(1.,.92,.65)*exp(-r*r/.03)*(.08+.05*sin(t*.7))*on;
 gl_FragColor=vec4(c,1.);}`;
const VS=`attribute vec2 p;varying vec2 uv;void main(){uv=vec2(p.x*.5+.5,.5-p.y*.5);gl_Position=vec4(p,0.,1.);}`;
const sc=document.getElementById('sc');let motion=true,on=1,cur=0;const paw=document.createElement('img');paw.id='paw';paw.src='paw.webp';
// build scenes top (last) to bottom (first)
for(let i=SCENES.length-1;i>=0;i--){const S=SCENES[i];S.el=document.createElement('div');S.el.className='scene';S.art=document.createElement('div');S.art.className='art';
 S.cv=document.createElement('canvas');S.fx=document.createElement('canvas');S.art.append(S.cv,S.fx);S.el.appendChild(S.art);sc.appendChild(S.el)}
function put(S,src,x,y,w){const i=document.createElement('img');i.src=src;i.className='o';i.style.left=x*100+'%';i.style.top=y*100+'%';i.style.width=w*100+'%';S.art.appendChild(i);return i}
function buttons(){SCENES.forEach((S,si)=>{S.art.querySelectorAll('.o,.n').forEach(e=>e.remove());S.spots.forEach(([x,y,w],k)=>{const L=si*5+k,st=L<cur?'done':L===cur?'cur':'lock';
 put(S,st==='done'?'mk_done.png':st==='cur'?'mk_cur.png':'mk_lock.png',x,y+w*.18,w);
 if(st!=='lock'){const n=document.createElement('div');n.className='n';n.textContent=L+1;n.style.left=x*100+'%';n.style.top=(y-w*.06)*100+'%';n.style.fontSize=(w*.33*S.art.clientWidth)+'px';S.art.appendChild(n)}})});placePaw(cur)}
function placePaw(L){const S=SCENES[Math.floor(L/5)],[x,y,w]=S.spots[L%5];S.art.appendChild(paw);paw.style.left=x*100+'%';paw.style.top=(y-w*.27)*100+'%';paw.style.width=w*.5*100+'%'}
function size(){const DPR=Math.min(2.5,devicePixelRatio||1),H=sc.clientHeight,avail=H-innerWidth*327/1170*.92;
 for(const S of SCENES){let w=innerWidth,h=w*S.IH/S.IW;if(h<avail){h=avail;w=h*S.IW/S.IH}
  S.art.style.width=w+'px';S.art.style.height=h+'px';S.art.style.top='0px';S.cv.width=Math.round(w*DPR);S.cv.height=Math.round(h*DPR);S.fx.width=S.cv.width;S.fx.height=S.cv.height}buttons()}
function initGL(S){const gl=S.cv.getContext('webgl',{alpha:false,antialias:false});S.gl=gl;
 const sh=(k,src)=>{const s=gl.createShader(k);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s};
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);S.pr=pr;
 gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);const ap=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(ap);gl.vertexAttribPointer(ap,2,gl.FLOAT,false,0,0);
 const U=n=>gl.getUniformLocation(pr,n);S.U=U;
 const tex=(f,unit,name)=>new Promise(ok=>{const im=new Image();im.onload=()=>{gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);
  for(const [a,b] of [[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR],[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE]])gl.texParameteri(gl.TEXTURE_2D,a,b);gl.uniform1i(U(name),unit);ok()};im.src=S.dir+'/'+f+'?v=6'});
 return Promise.all([tex('scene.png',0,'tB'),tex('masks.png',1,'tM'),tex('skyclean.png',2,'tS'),tex('clouds.png',3,'tC'),tex('cloudrm.png',4,'tR')]).then(()=>{gl.uniform1f(U('chf'),S.CH/S.IH);S.ready=1})}
SCENES.forEach(S=>{S.tw=S.tw.map(([x,y])=>({x,y,ph:Math.random()*6.3,sp:.7+Math.random()*.8}));S.pol=[...Array(18)].map(()=>({x:Math.random(),y:.45+Math.random()*.5,vx:(Math.random()-.5)*.004,vy:-.004-Math.random()*.006,ph:Math.random()*6.3}))});
size();addEventListener('resize',size);
Promise.all(SCENES.map(initGL)).then(()=>{sc.scrollTop=sc.scrollHeight;let t0=performance.now(),last=t0;
 (function frame(now){const t=window.__t!=null?window.__t:(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;on+=((motion?1:0)-on)*Math.min(1,dt*4);
  const vh=sc.clientHeight;
  for(const S of SCENES){const r=S.el.getBoundingClientRect();if(r.bottom<0||r.top>vh)continue;const gl=S.gl,U=S.U;
   gl.viewport(0,0,S.cv.width,S.cv.height);gl.uniform1f(U('t'),t);gl.uniform1f(U('on'),on);gl.uniform2f(U('px'),1/S.IW,1/S.IH);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
   const fg=S.fx.getContext('2d'),W=S.fx.width,H=S.fx.height;fg.clearRect(0,0,W,H);fg.globalAlpha=on;
   for(const s of S.tw){const a=Math.max(0,Math.sin(t*s.sp+s.ph))**6;if(a<.02)continue;const x=s.x*W,y=s.y*H,rr=W*.012*a;fg.strokeStyle=`rgba(255,255,240,${.9*a})`;fg.lineWidth=Math.max(1,W*.0018);fg.beginPath();fg.moveTo(x-rr,y);fg.lineTo(x+rr,y);fg.moveTo(x,y-rr);fg.lineTo(x,y+rr);fg.stroke()}
   for(const p of S.pol){p.x+=p.vx*dt+Math.sin(t+p.ph)*.0003;p.y+=p.vy*dt;if(p.y<.36){p.y=1;p.x=Math.random()}const a=.35+.35*Math.sin(t*2+p.ph);fg.fillStyle=`rgba(255,250,210,${a*.8})`;fg.beginPath();fg.arc(p.x*W,p.y*H,W*.0022,0,7);fg.fill()}
   if(S.rain){if(!S.drops)S.drops=[...Array(Math.round(170*S.rain))].map(()=>({x:Math.random(),y:Math.random(),l:.015+Math.random()*.02,v:.55+Math.random()*.35}));
    fg.globalAlpha=1;fg.strokeStyle='rgba(230,238,255,.75)';fg.lineWidth=Math.max(1.2,W*.002);fg.lineCap='round';fg.beginPath();
    for(const d of S.drops){d.y+=d.v*dt;if(d.y>1.02){d.y=-.03;d.x=Math.random()}const x=d.x*W,y=d.y*H;fg.moveTo(x,y);fg.lineTo(x-W*.004,y+d.l*H)}fg.stroke();
    if(!S.rip)S.rip=[];if(Math.random()<.35*S.rain){const sp=S.spots[Math.floor(Math.random()*5)];S.rip.push({x:sp[0]+(Math.random()-.5)*.25,y:sp[1]+(Math.random()-.5)*.08,t:0})}
    for(const r of S.rip){r.t+=dt;const a=Math.max(0,1-r.t/.9);fg.strokeStyle=`rgba(235,240,255,${.5*a})`;fg.beginPath();fg.ellipse(r.x*W,r.y*H,W*.03*r.t,W*.009*r.t,0,0,7);fg.stroke()}
    S.rip=S.rip.filter(r=>r.t<.9)}
   fg.globalAlpha=1}
  requestAnimationFrame(frame)})(t0)});
sc.addEventListener('scroll',()=>{if(sc.scrollTop<sc.scrollHeight-sc.clientHeight*1.5)document.getElementById('hint').style.opacity=0},{passive:true});
function win(){const N=SCENES.length*5;if(cur>=N-1){cur=0;buttons();sc.scrollTo({top:sc.scrollHeight,behavior:'smooth'});return}
 try{new Audio('../au/rambo_bark.mp3').play()}catch(e){}
 if((cur+1)%5===0){const A=SCENES[Math.floor(cur/5)],B=SCENES[Math.floor(cur/5)+1];cur++;
  // walk through the gate: push into scene A's gate, cut to scene B slightly zoomed, settle
  A.art.style.transformOrigin=A.gate[0]*100+'% '+A.gate[1]*100+'%';A.art.style.transition='transform .9s cubic-bezier(.5,0,.8,.5),filter .9s';A.art.style.transform='translateX(-50%) scale(2.2)';A.art.style.filter='brightness(1.25)';
  setTimeout(()=>{B.art.style.transition='none';B.art.style.transformOrigin='50% 100%';B.art.style.transform='translateX(-50%) scale(1.25)';B.art.style.filter='brightness(1.2)';
   sc.style.scrollSnapType='none';sc.scrollTop=B.el.offsetTop;sc.style.scrollSnapType='';
   A.art.style.transition='none';A.art.style.transform='translateX(-50%)';A.art.style.filter='';buttons();
   requestAnimationFrame(()=>requestAnimationFrame(()=>{B.art.style.transition='transform 1s cubic-bezier(.2,.6,.3,1),filter 1s';B.art.style.transform='translateX(-50%)';B.art.style.filter=''}))},880);return}
 const S=SCENES[Math.floor(cur/5)],[x0,y0,w0]=S.spots[cur%5],[x1,y1,w1]=S.spots[cur%5+1],t0=performance.now();
 (function hop(now){const u=Math.min(1,(now-t0)/900),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,w=w0+(w1-w0)*e;
  paw.style.left=(x0+(x1-x0)*e)*100+'%';paw.style.top=((y0-w0*.27)+((y1-w1*.27)-(y0-w0*.27))*e-Math.sin(u*Math.PI)*.07)*100+'%';paw.style.width=w*.5*100+'%';
  if(u<1)requestAnimationFrame(hop);else{cur++;buttons()}})(t0)}
document.getElementById('win').onclick=win;
document.getElementById('tog').onclick=e=>{motion=!motion;e.target.textContent='Motion: '+(motion?'ON':'OFF');e.target.classList.toggle('off',!motion)};
</script></body></html>
