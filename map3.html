<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Good Boy Bobo · Map</title>
<script src="audio.js?v=22"></script><script src="common.js?v=22"></script>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b5459;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#vp{position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#vp::-webkit-scrollbar{display:none}
#world{position:relative;width:1290px;transform-origin:0 0}
#world img,#world canvas,#fixed img,#fixed canvas{position:absolute;display:block;pointer-events:none}
.stop{position:absolute;width:380px;height:380px;cursor:pointer;z-index:50}
#fixed{position:fixed;left:0;top:0;width:1290px;height:2796px;transform-origin:0 0;pointer-events:none}
#fixed .h{position:absolute;pointer-events:auto;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 110px);transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;font:600 14px -apple-system,system-ui;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;white-space:nowrap}
#toast.on{opacity:1}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) drop-shadow(0 0 18px rgba(200,255,120,.8))}}
.cur img:first-child{animation:glow 1.6s ease-in-out infinite}
</style></head><body>
<div id="app" style="display:none"></div>
<div id="vp"><div id="world"></div></div>
<div id="fixed"></div><div id="toast"></div>
<script>
const M='a/map2/',HM='a/home/',SH=2462;
// 5 chapters x 2 screens; stops listed bottom -> top in each screen (canvas px)
const CH=[['THE BACKYARD','Ch01_Backyard'],['THE NEIGHBORHOOD','Ch02_Neighborhood'],['VET VISIT','Ch03_Vet_Visit'],['RAINY DAY','Ch04_Rainy_Day'],["GRAMMY'S HOUSE",'Ch05_Grammys_House']];
const STOPS=[
 [[560,2280],[330,1920],[500,1620],[900,1330],[930,1040]],
 [[620,2280],[560,1950],[430,1700],[1000,1350],[560,1110]],
 [[560,2250],[420,1900],[300,1580],[560,1280],[380,1000]],
 [[600,2250],[860,1700],[560,1360],[500,1060],[580,860]],
 [[480,2250],[230,1800],[270,1330],[520,900],[1000,880]],
 [[340,2260],[430,1940],[380,1600],[560,1270],[900,1130]],
 [[640,2300],[460,2000],[330,1700],[640,1380],[860,1020]],
 [[380,2150],[620,1880],[880,1600],[700,1050],[560,820]],
 [[560,2300],[620,1980],[440,1680],[620,1400],[900,1140]],
 [[880,2280],[960,1980],[1040,1690],[900,1420],[700,1240]]];
const CROP=[450,450,450,450,250,280,300,200,330,0]; // trim each screen's sky so screens join with a tree/roof line
const NS=STOPS.length,MAXL=NS*5,FE=140;
const HS=CROP.map(c=>SH-c);const TOP=[];{let acc=0;for(let s=NS-1;s>=0;s--){TOP[s]=acc;acc+=HS[s]-(s>0?FE:0)}}
const TOT=TOP[0]+HS[0];
const world=document.getElementById('world'),vp=document.getElementById('vp'),fixed=document.getElementById('fixed');
world.style.height=TOT+'px';
const put=(par,src,x,y,w,h)=>{const i=new Image();i.src=src;i.alt='';Object.assign(i.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});par.appendChild(i);return i};
const stars=(()=>{try{return JSON.parse(localStorage.getItem('gbb_play')||'{}').stars||{}}catch(e){return{}}})();
const cur=Math.min(MAXL,gbbCur());
const fontP=new FontFace('BoboNunito','url(a/home/Nunito-Black.ttf)',{weight:'900'}).load().then(f=>document.fonts.add(f));
function label(par,txt,box,fs,x,y,w,h,scale){ // draw cream/dark-green text into a canvas over box
 const c=document.createElement('canvas');const r=Math.max(1,devicePixelRatio||1)*scale;c.width=Math.round(w*r);c.height=Math.round(h*r);
 Object.assign(c.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});par.appendChild(c);
 fontP.then(()=>{const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);let f=fs;const fnt=s=>`900 ${s}px BoboNunito`;g.font=fnt(f);
  const sp=t=>{let w=0;for(const ch of t)w+=g.measureText(ch).width+f*.03;return w-f*.03};
  while(f>20&&sp(txt)>w*.84){f--;g.font=fnt(f)}
  const m=g.measureText(txt);let cx=(w-sp(txt))/2;const by=h/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;
  g.lineJoin='round';const draw=(fill,stroke,lw,dy,blur,alpha)=>{g.save();g.globalAlpha=alpha;if(blur)g.filter=`blur(${blur}px)`;let x=cx;for(const ch of txt){g.lineWidth=lw;g.strokeStyle=stroke;g.fillStyle=fill;g.strokeText(ch,x,by+dy);g.fillText(ch,x,by+dy);x+=g.measureText(ch).width+f*.03}g.restore()};
  const k=f/box;draw('#002C25','#002C25',box.ow*2*k,box.sh*k,box.bl*k,.75);draw(box.fill,box.ol,box.ow*2*k,0,0,1)})}
const MK={fill:'#FFF8E7',ol:'#063D35',ow:5,sh:6,bl:3};
// backgrounds: screen 0 at the bottom
for(let s=0;s<NS;s++){const ci=s>>1,y=TOP[s]-CROP[s];
 const im=put(world,`${M}${CH[ci][1]}_Screen0${(s&1)+1}.webp`,0,y,1290,2796);im.style.clipPath=`inset(${CROP[s]}px 0 ${2796-SH}px 0)`;
 if(s<NS-1){const a=CROP[s]/2796*100,b=(CROP[s]+FE)/2796*100;const mk=`linear-gradient(to bottom,transparent ${a}%,#000 ${b}%)`;im.style.webkitMaskImage=mk;im.style.maskImage=mk}
 im.style.zIndex=NS-s;}
// stops
let curXY=null;
STOPS.forEach((arr,s)=>arr.forEach(([x,y0],k)=>{
 const L=s*5+k+1,y=TOP[s]-CROP[s]+y0,st=stars[L-1]||0,sz=380;
 const kind=L<cur||st?'completed':L==cur?'current':'locked';
 const wrap=document.createElement('div');wrap.className='stop'+(kind=='current'?' cur':'');Object.assign(wrap.style,{left:(x-sz/2)+'px',top:(y-sz*424/512)+'px'});world.appendChild(wrap);
 const gs=document.createElement('div');Object.assign(gs.style,{position:'absolute',left:(x-sz*.36)+'px',top:(y-sz*.06)+'px',width:(sz*.72)+'px',height:(sz*.16)+'px',borderRadius:'50%',background:'radial-gradient(closest-side,rgba(20,35,10,.55),rgba(20,35,10,.25) 60%,rgba(20,35,10,0))',zIndex:49,pointerEvents:'none'});world.appendChild(gs);
 put(wrap,`${M}marker_${kind}_512.webp`,0,0,sz,sz);const k5=sz/512;
 const nb={locked:[150,128,212,106,100],current:[125,133,262,170,132],completed:[125,120,262,145,116]}[kind];
 label(wrap,String(L),Object.assign({},MK,{ }),nb[4]*k5,nb[0]*k5,nb[1]*k5,nb[2]*k5,nb[3]*k5,1);
 if(kind=='completed')[[123,279],[215,294],[307,279]].forEach(([sx,sy],i)=>{const e=put(wrap,M+'star_gold_512.webp',sx*k5,sy*k5,82*k5,82*k5);if(i>=st)e.style.filter='grayscale(1) brightness(.55)';});
 wrap.onclick=()=>{if(kind=='locked')return toast('Finish level '+cur+' first!');window.BA&&BA.play&&BA.play('tap',{gap:80});BA.nav('game.html?lv='+L)};
 if(kind=='current')curXY=[x,y];
}));
// Rambo + friends beside the current stop (locked Home masters, same proportions as Home)
if(curXY){const [x,y]=curXY,side=x<700?1:-1,H=500/1121;
 const fig=(k,w,h,cx,fy,flip)=>{const i=put(world,`${HM}${k}.webp`,cx-w/2,fy-h,w,h);i.style.zIndex=60;if(flip)i.style.transform='scaleX(-1)';return i};
 fig('L06_buck',370*H,729*H,x+side*520,y-40,side<0);
 fig('L08_rambo',709*H,1121*H,x+side*300,y+110,side<0);
 fig('L07_bunny',282*H,538*H,x-side*280,y+120,side>0);
 fig('L09_cardinal',250*H,336*H,x-side*250,y-170,side>0);}
// fixed UI: counters, gear, chapter banner, tab bar (Map active)
let BOXES={};
fetch(HM+'layers.json?v=22').then(r=>r.json()).then(m=>{BOXES=m;
 for(const k of ['L02_heart_counter','L03_bone_counter','L04_gear']){const [x,y,w,h]=m[k];put(fixed,`${HM}${k}.webp`,x,y,w,h)}
 window.BAN=put(fixed,M+'chapter_banner_blank_1290x500.webp',95,330,1100,1100*500/1290);
 const [bx,by,bw,bh]=m.L13_bottom_bar;put(fixed,HM+'L13_bottom_bar.webp',bx,by,bw,bh);
 const [tx,ty,tw,th]=m.L14_active_home_tile;put(fixed,HM+'L14_active_home_tile.webp',tx+258,ty,tw,th);
 ['L15_nav_home','L16_nav_map','L17_nav_toys','L18_nav_friends','L19_nav_shop'].forEach(k=>{const [x,y,w,h]=m[k];put(fixed,k=='L16_nav_map'?M+'nav_map_teal.webp':`${HM}${k}.webp`,x,y,w,h)});
 const G2=(typeof G!=='undefined'&&G)||{hearts:5,bones:0};
 label(fixed,String(Math.max(0,Math.min(5,G2.hearts|0))),{fill:'#006368',ol:'#003E42',ow:1,sh:3,bl:1},84,215,229,86,96,1);
 label(fixed,(+G2.bones||0).toLocaleString('en-US'),{fill:'#006368',ol:'#003E42',ow:1,sh:3,bl:1},84,603,229,237,96,1);
 const hit=(b,fn)=>{const d=document.createElement('div');d.className='h';Object.assign(d.style,{left:b[0]+'px',top:b[1]+'px',width:b[2]+'px',height:b[3]+'px'});d.onclick=fn;fixed.appendChild(d)};
 hit(m.L02_heart_counter,()=>go('shop'));hit(m.L03_bone_counter,()=>go('shop'));hit(m.L04_gear,()=>go('settings'));
 ['home','map','toys','friends','shop'].forEach((p,i)=>hit([i*258,2450,258,231],()=>p=='map'?scrollToCur(true):go(p)));
 chapterBanner();fit();});
let banCI=-1,banTxt=[];
function chapterBanner(){if(!window.BAN)return;const S=sc(),mid=vp.scrollTop/S+(innerHeight/S)*.55;let s=NS-1;for(let i=0;i<NS;i++)if(TOP[i]<=mid){s=i;break}const ci=s>>1;
 if(ci===banCI)return;banCI=ci;banTxt.forEach(c=>c.remove());const k=1100/1290;
 banTxt=[label(fixed,CH[ci][0],{fill:'#FFF5DE',ol:'#003C32',ow:6,sh:7,bl:4},114*k,95+127*k,330+83*k,1036*k,151*k,1),
  label(fixed,'Chapter '+(ci+1),{fill:'#FFF5DE',ol:'#003C32',ow:6,sh:7,bl:4},76*k,95+442*k,330+287*k,406*k,102*k,1)];
 banTxt=[...fixed.querySelectorAll('canvas')].slice(-2)}
const sc=()=>innerWidth/1290;
function fit(){const S=sc();world.style.transform=`scale(${S})`;world.style.width='1290px';world.parentElement.style.height='';
 world.style.marginBottom=(TOT*S-TOT)+'px';
 const fh=innerHeight/S;fixed.style.transform=`scale(${S})`;fixed.style.height=fh+'px';
 const off=fh-2796;fixed.querySelectorAll('img,canvas,.h').forEach(e=>{if(e.dataset.by===undefined)e.dataset.by=parseFloat(e.style.top);const by=+e.dataset.by;if(by>=2400)e.style.top=(by+off)+'px'});}
function scrollToCur(smooth){if(!curXY)return;const S=sc();vp.scrollTo({top:Math.max(0,curXY[1]*S-innerHeight*.55),behavior:smooth?'smooth':'auto'})}
vp.addEventListener('scroll',chapterBanner,{passive:true});
addEventListener('resize',()=>{fit();chapterBanner()});
fit();scrollToCur(false);
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1300)}
</script><script>BA.music('Theme')</script>
</body></html>
