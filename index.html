<title>Good Boy Bobo</title>
<style>
html,body{margin:0;height:100%;background:#0e2a2b;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#sa{position:fixed;left:0;top:0;width:1px;height:env(safe-area-inset-top);visibility:hidden;pointer-events:none}
#sb{position:fixed;left:0;bottom:0;width:1px;height:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}

iframe.scr.off{visibility:hidden;pointer-events:none;z-index:0}

#swbar{position:fixed;z-index:5;pointer-events:none;display:block}

<script>
/* Good Boy Bobo — app shell.
   Every screen lives in its own frame inside this one page. The audio engine lives here, so the music keeps
   playing straight through screen changes and nothing pops. Screens already opened stay alive in the background
   (paused, costing nothing), so going back to them is instant. A screen reloads only if the save changed since it
   was last shown (new progress, bones spent...), and the old screen stays on until the new one has painted. */
window.GBB_SHELL_HOST=true;
try{const q=new URLSearchParams(location.search);if(q.get('live'))localStorage.setItem('gbb_live',q.get('live'));if(q.get('mom')==='1')localStorage.setItem('gbb_mom','1');if(q.get('mom')==='0')localStorage.removeItem('gbb_mom')}catch(e){}
</script>

</head><body><img id="splash" src="splash.jpg?v=1" alt="" fetchpriority="high" decoding="sync"><div id="sa"></div><div id="sb"></div>
<script>
(function(){
const ROOT=location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,'');
const HOME='bovo11/index.html',MAP='bovo10/index.html';
const frames={};let shown=null,pending=null,calmAt=0;
const busyLoading=()=>Date.now()<calmAt||!calmAt||Object.values(frames).some(f=>!f._ready);   // keep the phone free while you use it
const sat=()=>document.getElementById('sa').getBoundingClientRect().height,sab=()=>document.getElementById('sb').getBoundingClientRect().height;
function norm(u){const x=new URL(u,ROOT);x.searchParams.delete('b');x.searchParams.delete('start');let rel=x.href.slice(ROOT.length);
 if(rel===''||/^index\.html/.test(rel))rel=HOME+rel.replace(/^index\.html/,'');
 if(/^map\.html/.test(rel))rel=MAP+rel.replace(/^map\.html/,'');
 return rel}
const keyOf=rel=>/^game_new\.html/.test(rel)?'game':rel.replace(/[?#].*$/,'');
const snap=()=>{const a=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(gbb|rv_)/.test(k)&&!/settings/.test(k))a.push(k+'='+localStorage.getItem(k))}}catch(e){}return a.sort().join('|')};
function make(rel,key){const f=document.createElement('iframe');f._rel=rel;f.className='scr off';f.setAttribute('allow','autoplay');f.setAttribute('scrolling','no');
 f._key=key;f._ready=false;f.src=ROOT+rel;document.body.appendChild(f);frames[key]=f;return f}
function swapTo(f){log([Date.now()%100000,'swap',f._key]);
 if(shown&&shown!==f){const o=shown;o._snap=snap();o.classList.add('off');try{o.contentWindow.GBB_hide&&o.contentWindow.GBB_hide()}catch(e){}
  if(o._key==='game'){setTimeout(()=>{o.remove();if(frames.game===o)delete frames.game},0)}}
 f.classList.remove('off');shown=f;pending=null;try{f.contentWindow.GBB_show&&f.contentWindow.GBB_show()}catch(e){}
 try{f.contentWindow.focus()}catch(e){}
 if(!calmAt){calmAt=Date.now()+900;const sp=document.getElementById('splash');if(sp)setTimeout(()=>sp.remove(),600)}
 if(!prewarmed)setTimeout(prewarm,1000);setTimeout(warmNeighbors,1200)}
const LOG=[];const log=a=>{LOG.push(a);if(LOG.length>60)LOG.shift()};function go(u){const rel=norm(u),key=keyOf(rel);let f=frames[key];log([Date.now()%100000,'go',key,f?(f._snap===snap()?'same':'changed'):'new',f&&f._ready]);
 if(f&&f===shown&&key!=='game')return;
 if(key==='game'&&f&&f!==shown&&f._pre&&!f._used&&f._rel===rel&&f._snap===snap()){f._used=true;f._pre=false;pending=f;if(f._ready)swapTo(f);return}   // that level was already loading in the background: use it
 if(f&&(key==='game'||f._snap!==snap())){if(f!==shown){f.remove();delete frames[key];f=null}else{f.contentWindow.location.replace(ROOT+rel);return}}
 if(!f)f=make(rel,key);
 pending=f;f._pre=false;if(f._ready)swapTo(f)}
function ready(win){for(const k in frames){const f=frames[k];if(f.contentWindow===win){f._ready=true;
  if(pending===f)swapTo(f);else if(f!==shown){try{win.GBB_hide&&win.GBB_hide()}catch(e){}}}}}
function startHidden(win){for(const k in frames){const f=frames[k];if(f.contentWindow===win)return !!f._pre&&pending!==f}return false}
function active(win){return !!shown&&shown.contentWindow===win}
// after the first screen is up, quietly open the Map (hidden and paused) so the first trip there is instant; other tabs stay alive once opened
let prewarmed=false;const WARM=[MAP];
function prewarm(){prewarmed=true;if(pending||busyLoading())return setTimeout(prewarm,1500);const rel=WARM.find(r=>!frames[r]);if(!rel)return;
 const f=make(rel,rel);f._pre=true;f._snap=snap();const t0=Date.now();(function wait(){if(f._ready||Date.now()-t0>8000)setTimeout(prewarm,1200);else setTimeout(wait,300)})()}
/* ---- thumb swipe between the five main screens (Home, Map, Toys, Friends, Shop) ----
   The screen follows the thumb; the next screen slides in beside it; the bottom menu stays put and its lit tile
   switches when the new screen lands. The screens either side of the current one are kept open (hidden, paused)
   so a swipe always has something to show. */
const TABS=[HOME,MAP,'bovo11/toys.html','bovo11/friends.html','bovo11/shop.html'],TABN=['home','map','toys','friends','shop'];
let drag=null,settling=false;
function tabFrame(i,create){const rel=TABS[i];if(!rel)return null;let f=frames[rel];
 if(f&&f!==shown&&f!==pending&&f._snap!==snap()){if(!create)return null;f.remove();delete frames[rel];f=null}
 if(!f&&create){f=make(rel,rel);f._pre=true;f._snap=snap()}return f}
function warmNeighbors(){if(drag||settling||pending||!shown||busyLoading())return;const i=TABS.indexOf(shown._key);if(i<0)return;const order=[i+1,i-1,i+2,i-2,i+3,i-3,i+4,i-4].filter(j=>j>=0&&j<TABS.length);for(const j of order){if(!tabFrame(j,false)){tabFrame(j,true);return}}}
setInterval(warmNeighbors,700);
// the level PLAY will open (the next unplayed one), loaded hidden and silent while you look around
function nextLevel(){let mx=0;try{const g=JSON.parse(localStorage.getItem('gbb_play')||'{}');for(const k in (g.stars||{}))mx=Math.max(mx,+k+1)}catch(e){}return Math.min(100,mx+1)}
function warmGame(){if(drag||settling||pending||!shown||shown._key==='game'||busyLoading())return;const rel='game_new.html?lv='+nextLevel();const g=frames.game;
 if(g&&g._rel===rel&&g._snap===snap())return;if(g){g.remove();delete frames.game}
 const f=make(rel,'game');f._pre=true;f._snap=snap()}
setInterval(warmGame,1500);
let bar=null;
function navOf(f){try{return f.contentDocument.getElementById('gbnav')}catch(e){return null}}
function barOn(cur){try{const b=cur.contentDocument.querySelector('#gbnav .barimg');if(!b)return;const r=b.getBoundingClientRect();
 bar=new Image();bar.id='swbar';bar.src=b.src;Object.assign(bar.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',filter:getComputedStyle(b).filter});
 document.body.appendChild(bar);}catch(e){bar=null}}
function barsHidden(fs,h){fs.forEach(f=>{const n=f&&navOf(f);if(n)n.style.visibility=h?'hidden':''})}
const swipe={
 start(win,idx){log([Date.now()%100000,'sw-start',idx,!!drag,settling,!!pending,!!shown&&shown.contentWindow===win]);if(drag||settling||pending||!shown||shown.contentWindow!==win)return false;
  const p=tabFrame(idx-1,false),n=tabFrame(idx+1,false);
  drag={idx,cur:shown,prev:p&&p._ready?p:null,next:n&&n._ready?n:null,W:innerWidth,x:0};
  [drag.cur,drag.prev,drag.next].forEach(f=>{if(f){f.style.transition='none';f.style.willChange='transform'}});
  barOn(drag.cur);if(bar)barsHidden([drag.cur,drag.prev,drag.next],true);return true},
 move(dx){const d=drag;if(!d)return;const W=d.W;let x=dx;const nb=x<0?d.next:d.prev;
  if(!nb){const a=Math.abs(x);x=Math.sign(x)*W*.16*(1-Math.exp(-a/(W*.35)))}
  d.x=x;d.cur.style.transform='translate3d('+x+'px,0,0)';
  [[d.prev,1-W],[d.next,W-1]].forEach(([f,off])=>{if(!f)return;const on=(off<0&&x>0)||(off>0&&x<0);
   if(on){if(!f.classList.contains('peek')){try{f.contentWindow.GBB_peek&&f.contentWindow.GBB_peek(true)}catch(e){}}f.classList.remove('off');f.classList.add('peek');f.style.transform='translate3d('+(x+off)+'px,0,0)'}else{if(f.classList.contains('peek')){try{f.contentWindow.GBB_peek&&f.contentWindow.GBB_peek(false)}catch(e){}}f.classList.add('off');f.classList.remove('peek')}})},
 end(dx,v){const d=drag;if(!d)return;drag=null;settling=true;const W=d.W,x=d.x,dir=x<0?1:-1,nb=dir>0?d.next:d.prev;
  const fling=Math.abs(v)>.35&&Math.sign(v)===Math.sign(x);
  const commit=!!nb&&(Math.abs(x)>W*.22||fling);
  const want=!nb&&TABS[d.idx+dir]&&(Math.abs(dx)>W*.22||(Math.abs(v)>.35&&Math.sign(v)===Math.sign(dx)));
  log([Date.now()%100000,'swipe',d.idx,Math.round(x),Math.round(dx),+v.toFixed(2),!!nb,commit,!!want]);
  const tx=commit?-dir*W:0,ms=Math.round(Math.max(150,Math.min(300,Math.abs(tx-x)/W*320)));
  const ease='transform '+ms+'ms cubic-bezier(.22,.9,.3,1)';
  [d.cur,d.prev,d.next].forEach(f=>{if(f)f.style.transition=ease});
  d.cur.style.transform='translate3d('+tx+'px,0,0)';
  if(nb&&nb.classList.contains('peek'))nb.style.transform='translate3d('+(tx+dir*(W-1))+'px,0,0)';
  if(commit&&bar){try{const b2=nb.contentDocument.querySelector('#gbnav .barimg'),r=b2.getBoundingClientRect();bar.src=b2.src;Object.assign(bar.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',filter:getComputedStyle(b2).filter})}catch(e){}}
  setTimeout(()=>{
   [d.cur,d.prev,d.next].forEach(f=>{if(!f)return;f.style.transition='';f.style.transform='';f.style.willChange='';f.classList.remove('peek');if(f!==shown){f.classList.add('off');try{f.contentWindow.GBB_peek&&f.contentWindow.GBB_peek(false)}catch(e){}}});
   if(commit){pending=nb;nb._pre=false;swapTo(nb)}
   barsHidden([d.cur,d.prev,d.next],false);const b=bar;bar=null;if(b)requestAnimationFrame(()=>requestAnimationFrame(()=>b.remove()));
   settling=false;if(want)go(TABS[d.idx+dir])},ms+20)}};
window.GBB_SHELL={LOG,go,ready,active,startHidden,swipe,get sat(){return sat()},get sab(){return sab()}};
// keep the shell's own frame from ever showing a stale "pending" screen if a frame fails to report
setInterval(()=>{if(pending&&!pending._ready){try{const d=pending.contentDocument;if(d&&d.readyState==='complete')ready(pending.contentWindow)}catch(e){}}},500);
const q=new URLSearchParams(location.search);go(q.get('start')||HOME);
// keep a copy of the game's files on the phone so every visit after the first opens instantly
try{if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}catch(e){}
})();
</script></body></html>
