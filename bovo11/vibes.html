<script>
'use strict';
const ui=K.scene('settings/bg.jpg?v=4',852,1846,I=>CL.layout&&CL.layout(I));
const {h}=K;K.topbar(ui,'settings.html');
const {col}=CL.scroll(ui);
CL.extraTop=80;CL.title(col,'Vibration Lab');
const rich=!!(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.haptic2);
const T=(at,i,s)=>({at,i,s}),C=(at,dur,i,s)=>({at,dur,i,s});
const P=(...e)=>({t:'pattern',events:e});
// [name, what it feels like, rich haptic, simple fallback]
const GROUPS=[
 ['Apple taps','peach',[
  ['Light tap','A soft little click',{t:'impact',style:'light'},10],
  ['Medium tap','A firm click (buttons now)',{t:'impact',style:'medium'},20],
  ['Heavy tap','A solid knock',{t:'impact',style:'heavy'},40],
  ['Soft tap','Squishy and round, like a pillow',{t:'impact',style:'soft'},18],
  ['Rigid tap','Crisp and sharp, like a key',{t:'impact',style:'rigid'},14],
  ['Selection tick','A tiny tick, like a picker wheel',{t:'select'},6]]],
 ['Apple alerts','mint',[
  ['Success','Da-dum! A happy double',{t:'note',kind:'success'},[15,60,25]],
  ['Warning','Two even bumps',{t:'note',kind:'warning'},[25,80,25]],
  ['Error','Three quick buzzes',{t:'note',kind:'error'},[20,40,20,40,20]]]],
 ['Custom feels','lav',[
  ['Bubble pop','Tiny sharp pop, for each match',P(T(0,.7,1)),8],
  ['Double pop','Pop-pop, for a 4-match',P(T(0,.7,.9),T(.07,.9,.9)),[8,50,10]],
  ['Thump','Deep low hit, for a bomb',P(T(0,1,.05),C(0,.12,.6,.05)),45],
  ['Crate crunch','Rapid crackle, for breaking crates',P(...[0,.025,.05,.075,.1].map((t,k)=>T(t,.9-k*.12,.8))),[6,15,6,15,6]],
  ['Rumble','Low rolling buzz',P(C(0,.45,.8,.1)),400],
  ['Rainbow roll','Swells up then fades, for the rainbow ball',P(C(0,.15,.3,.3),C(.15,.15,.7,.4),C(.3,.2,1,.5),T(.5,1,.8)),[60,20,80,20,120]],
  ['Combo climb','Taps that get stronger, for big combos',P(...[0,.08,.16,.24,.32].map((t,k)=>T(t,.35+k*.16,.5+k*.1))),[8,60,12,60,16,60,22,60,30]],
  ['Heartbeat','Lub-dub, lub-dub',P(T(0,.9,.2),T(.13,.6,.2),T(.6,.9,.2),T(.73,.6,.2)),[30,100,20,350,30,100,20]],
  ['Bounce','Like a ball bouncing to a stop',P(T(0,1,.4),T(.18,.7,.4),T(.31,.45,.4),T(.4,.25,.4)),[30,150,20,100,12,70,6]],
  ['Level win','Celebration: pops into a big finish',P(T(0,.6,.8),T(.1,.7,.8),T(.2,.8,.8),C(.3,.35,1,.3)),[10,80,12,80,15,80,300]],
  ['Out of moves','A slow sad droop',P(C(0,.25,.6,.1),C(.3,.4,.3,.05)),[200,80,300]],
  ['Coin drop','Clink-clink, for earning bones',P(T(0,.8,1),T(.09,.5,1),T(.15,.3,1)),[8,60,6,40,4]]]]];
if(!rich){const n=CL.card(col,'gold',1);h('div','vl-note',n).textContent='To feel all of these properly, update the app in Xcode with the newest code. Right now only simple buzzes work.'}
let num=0;
GROUPS.forEach(([title,tone,items],gi)=>{const c=CL.card(col,tone,gi+2);CL.head(c,title);const ins=h('div','cl-inset',c);
 items.forEach(([name,desc,hap,fb])=>{num++;const r=h('div','vl',ins);h('div','n',r).textContent=num;const tx=h('div','tx',r);h('b','',tx).textContent=name;h('small','',tx).textContent=desc;
  const go=()=>{r.classList.remove('hit');void r.offsetWidth;r.classList.add('hit');
   try{if(rich)webkit.messageHandlers.haptic2.postMessage(hap);else if(navigator.vibrate)navigator.vibrate(fb)}catch(e){}};
  CL.btn(r,'Try',go,'mint')})});
K.start();
