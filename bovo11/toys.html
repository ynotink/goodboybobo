<link rel="stylesheet" href="../uikit/kit.css?v=1">
<style>
#inner{margin:calc(var(--u)*-22) calc(var(--u)*-26) calc(var(--u)*-10);display:flex;flex-direction:column;align-items:stretch}
#count{text-align:center;font-size:calc(var(--u)*21);color:#1b4b50;line-height:1;margin-top:calc(var(--u)*2)}
.prog{position:relative;height:calc(var(--u)*19);margin:calc(var(--u)*9) calc(var(--u)*4) 0}
.prog .tr,.prog .fl{position:absolute;top:0;bottom:0;left:0;border-style:solid;border-width:calc(var(--u)*9.5) calc(var(--u)*10)}
.prog .tr{right:0;border-image:url(../uikit/progress_track.webp?v=1) 34 36 fill/calc(var(--u)*9.5) calc(var(--u)*10) stretch}
.prog .fl{width:calc(var(--u)*20);border-image:url(../uikit/progress_fill.webp?v=1) 34 36 fill/calc(var(--u)*9.5) calc(var(--u)*10) stretch;transition:width 900ms cubic-bezier(.3,1.2,.5,1) 450ms}
.chap{display:flex;align-items:center;gap:calc(var(--u)*7);margin-top:calc(var(--u)*13);height:calc(var(--u)*40)}
.chap .sq{width:calc(var(--u)*42);height:calc(var(--u)*40);flex:none}
.chap .sq svg{position:relative;width:42%;height:42%}
.chap .name{flex:1;height:100%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*21);color:#1b4b50;border-width:calc(var(--u)*18) calc(var(--u)*19)}
.chap .name span{margin:calc(var(--u)*-18) 0;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*8);margin-top:calc(var(--u)*11)}
.toy{position:relative;height:calc(var(--u)*72);border-width:calc(var(--u)*18);cursor:pointer}
.toy .pic{position:absolute;left:calc(var(--u)*-13);top:calc(var(--u)*-11);width:calc(var(--u)*54);height:calc(var(--u)*56);object-position:left center;object-fit:contain;transition:transform 120ms}
.toy .nm{position:absolute;left:calc(var(--u)*44);right:calc(var(--u)*-8);top:calc(var(--u)*-6);height:calc(var(--u)*22);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*14);line-height:1;color:#1b4b50;white-space:nowrap}
.toy .ck{position:absolute;left:calc(var(--u)*44 + (100% - var(--u)*36)/2 - var(--u)*15);bottom:calc(var(--u)*-10);width:calc(var(--u)*30);height:calc(var(--u)*30)}
.toy.wig .pic{animation:wig 520ms cubic-bezier(.3,1.4,.5,1)}
@keyframes wig{20%{transform:scale(1.14) rotate(-10deg)}45%{transform:scale(1.1) rotate(8deg)}70%{transform:scale(1.04) rotate(-3deg)}100%{transform:none}}
.toy.wig .ck{animation:kBump 360ms cubic-bezier(.3,1.6,.5,1) 80ms}
.go.k-go .toy{}
.next{position:relative;margin-top:calc(var(--u)*24)}
.next .k-plate{position:absolute;left:50%;top:calc(var(--u)*-15);transform:translateX(-50%);width:calc(var(--u)*272);height:calc(var(--u)*36);font-size:calc(var(--u)*17.5);color:#1b4b50;gap:calc(var(--u)*6);z-index:2}
.next .k-plate img{width:calc(var(--u)*24);height:calc(var(--u)*24);margin:calc(var(--u)*-12) 0;object-fit:contain}
.next .k-plate span{margin:calc(var(--u)*-10) 0}
.next .k-card{border-width:calc(var(--u)*20);height:calc(var(--u)*92)}

.sils>div+div::before{content:'';position:absolute;left:0;top:22%;bottom:12%;width:1.5px;background:rgba(150,105,55,.3)}
.sils img{height:calc(var(--u)*50);max-width:78%;object-fit:contain;margin-top:calc(var(--u)*8);opacity:.92}
.sils .wig img{animation:kNope 360ms}
</style></head><body>
<script src="../uikit/kit.js?v=4"></script>
<script>
'use strict';
const IW=852,IH=1846,SHELF=505;     // the cardinal's & bunny's shelves in the scene
const ui=K.scene('toys/bg.jpg?v=6',IW,IH,layout);
const {h,img}=K;
K.topbar(ui,'settings.html');
const title=h('div','k-title pg k-drop',ui);title.textContent='Toy Box';title.style.setProperty('--i',1);
const panel=h('div','k-panel pg k-pop',ui);const inner=h('div','',panel);inner.id='inner';
let ri=0;const seq=el=>{el.classList.add('k-in');el.style.setProperty('--i',ri++);return el};
const TOYS=[['tennis','Tennis Ball'],['rope','Rope Tug'],['ring','Chew Ring'],['frisbee','Frisbee'],['duck','Rubber Duck'],['bone','Chew Bone']];
const got=TOYS.length,total=30;
const cnt=seq(h('div','',inner));cnt.id='count';cnt.textContent=`${got} / ${total} Toys Collected`;
const bar=seq(h('div','prog',inner));h('div','tr',bar);const fill=h('div','fl',bar);
// chapter picker
const tri=d=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 20 20');s.innerHTML=`<path d="${d<0?'M15 3 L4 10 L15 17Z':'M5 3 L16 10 L5 17Z'}" fill="#145a5b" stroke="#145a5b" stroke-width="2.5" stroke-linejoin="round"/>`;return s};
const chap=seq(h('div','chap',inner));
const sq=d=>{const b=K.button('booster','',()=>K.toast('More chapters are coming soon!'));b.classList.add('sq');b.appendChild(tri(d));return b};
chap.appendChild(sq(-1));const nm=h('div','k-pill name',chap);h('span','',nm).textContent='The Backyard';chap.appendChild(sq(1));
// toys
const grid=h('div','grid',inner);
for(const [k,label] of TOYS){const c=seq(h('div','k-card toy',grid));const p=h('img','pic',c);p.src=`toys/items/${k}.webp?v=1`;
 const nmE=h('div','nm',c);nmE.textContent=label;if(label.length>10)nmE.style.fontSize='calc(var(--u)*12.8)';img('badge_check','ck',c);
 K.press(c,()=>{c.classList.remove('wig');void c.offsetWidth;c.classList.add('wig')});c.addEventListener('animationend',e=>{if(e.target.classList.contains('pic'))c.classList.remove('wig')})}
// next chapter
const nx=seq(h('div','next',inner));const pl=h('div','k-plate',nx);img('ic_lock','',pl);h('span','',pl).textContent='Next Chapter: The Park';
const nc=h('div','k-card',nx);const sl=h('div','sils',nc);
for(const k of ['sil1','sil2','sil3']){const d=h('div','',sl);const i=h('img','',d);i.src=`toys/items/${k}.webp?v=1`;
 d.onclick=()=>{d.classList.remove('wig');void d.offsetWidth;d.classList.add('wig');K.buzz(15);K.toast('Finish The Backyard to unlock The Park!')}}
setTimeout(()=>{fill.style.width=Math.max(8,got/total*100)+'%'},50);
function layout(I){const s=I.sy(SHELF);K.fitPanel(panel,title,I,s+12*I.wu,s-34*I.wu)}
K.start();
</script><script src="../nav/nav.js?v=4" data-page="toys"></script><script>window.BA&&BA.music("inside_myself")</script></body></html>
