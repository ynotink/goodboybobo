<!doctype html><html><head><meta charset="utf-8"><script src="../review_shim.js?v=2"></script><script src="../economy.js?v=1"></script><script src="../col.js?v=1"></script><script src="../audio.js?v=24"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Good Boy Bobo — Settings</title>
<link rel="stylesheet" href="../uikit/kit.css?v=7">
<style>
/* page */
#inner{margin:calc(var(--u)*-10) calc(var(--u)*-24) calc(var(--u)*-22);display:flex;flex-direction:column;gap:calc(var(--u)*15)}
.sec{position:relative;padding-top:calc(var(--u)*14)}
.sec .k-plate{position:absolute;left:50%;top:calc(var(--u)*-14);transform:translateX(-50%);width:calc(var(--u)*182);height:calc(var(--u)*32);font-size:calc(var(--u)*19.5);color:#1b4b50;z-index:2}
.sec .k-card{padding:calc(var(--u)*4) calc(var(--u)*4);border-width:calc(var(--u)*20)}
.box{margin:calc(var(--u)*-16) calc(var(--u)*-14);padding-top:calc(var(--u)*4)}
.row{display:flex;align-items:center;height:calc(var(--u)*39);gap:calc(var(--u)*10);padding:0 calc(var(--u)*2);cursor:pointer;position:relative}
.row+.row::before{content:'';position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);top:0;height:1.5px;background:linear-gradient(90deg,transparent,rgba(150,105,55,.25) 8%,rgba(150,105,55,.25) 92%,transparent)}
.row .ic{width:calc(var(--u)*30);height:calc(var(--u)*30);object-fit:contain;flex:none}
.row .tx{flex:1;font-size:calc(var(--u)*16);color:#24434c;white-space:nowrap}
.row .k-tg{width:calc(var(--u)*54);height:calc(var(--u)*28)}
.row .val{font-size:calc(var(--u)*13.5);color:#24434c;display:flex;align-items:center;gap:calc(var(--u)*4)}
.chev{width:calc(var(--u)*10);height:calc(var(--u)*16)}
.row .k-btn{width:calc(var(--u)*86);height:calc(var(--u)*33)}
.row .k-btn .k-lbl{font-size:calc(var(--u)*14.5);top:calc(var(--u)*1)}
.row.tap .ic{animation:kBump 360ms cubic-bezier(.3,1.6,.5,1)}
.helps{display:flex;flex-direction:column;gap:calc(var(--u)*8);padding:calc(var(--u)*6) 0 calc(var(--u)*2)}
.k-pill.k-btn{height:calc(var(--u)*37);border-width:calc(var(--u)*18) calc(var(--u)*19);gap:calc(var(--u)*9);font-size:calc(var(--u)*16);color:#24434c}
.k-pill .ic{width:calc(var(--u)*27);height:calc(var(--u)*27);margin:calc(var(--u)*-14) 0;object-fit:contain}
.k-pill span{margin:calc(var(--u)*-14) 0;white-space:nowrap}
#ver{text-align:center;font-size:calc(var(--u)*12.5);color:#8a6d4c;padding:calc(var(--u)*1) 0 calc(var(--u)*5)}
</style></head><body>

<script src="../uikit/kit.js?v=9"></script>
<script>
'use strict';
const IW=852,IH=1846,FENCE=474;      // fence rail top in the scene
const ui=K.scene('settings/bg.jpg?v=4',IW,IH,layout);
const ST=K.settings();const save=()=>{try{localStorage.setItem('gbb_settings',JSON.stringify(ST))}catch(e){};window.BA&&BA.apply&&BA.apply()};
const {h,img}=K;
K.topbar(ui,'index.html');
const title=h('div','k-title pg k-drop',ui);title.id='title';title.textContent='Settings';title.style.setProperty('--i',1);
const panel=h('div','k-panel pg k-pop',ui);panel.id='panel';
const inner=h('div','',panel);inner.id='inner';
let ri=0;
function section(name){const s=h('div','sec k-in',inner);s.style.setProperty('--i',ri++);const p=h('div','k-plate',s);p.textContent=name;return s}
function card(sec){const c=h('div','k-card',sec);const b=h('div','box',c);return b}
const chev=()=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 10 16');s.setAttribute('class','chev');s.innerHTML='<path d="M2.5 2 L8 8 L2.5 14" fill="none" stroke="#24434c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>';return s};
function row(box,icon,label,right,onTap){const r=h('div','row k-in',box);r.style.setProperty('--i',ri++);img(icon,'ic',r);const t=h('div','tx',r);t.textContent=label;if(right)r.appendChild(right);
 r.addEventListener('click',()=>{r.classList.remove('tap');void r.offsetWidth;r.classList.add('tap');onTap&&onTap()});r.addEventListener('animationend',e=>{if(e.target!==r)r.classList.remove('tap')});return r}
// Sound & Play
const s1=card(section('Sound & Play'));
const flip=k=>v=>{if(k==='vib')ST.vib=v?1:0;else if(!v){ST['_'+k]=ST[k];ST[k]=0}else ST[k]=ST['_'+k]||(k==='music'?70:80);save();if(k==='vib'&&v)K.buzz(30)};
const TG=[['ic_music','Music','music'],['ic_speaker','Sound Effects','sounds'],['ic_vibrate','Vibration','vib'],['ic_bell','Notifications','notif']];
for(const [ic,lb,k] of TG){const on=k==='notif'?false:k==='vib'?!!ST.vib:ST[k]>0;
 const tg=K.toggle(on,k==='notif'?()=>{K.toast('Notifications are coming soon!');return false}:flip(k));
 tg.setAttribute('aria-label',lb);row(s1,ic,lb,tg,()=>tg.click())}
// Account
const s2=card(section('Account'));
const val=t=>{const d=h('div','val');d.textContent=t;d.appendChild(chev());return d};
row(s2,'ic_person','Player Profile',(()=>{const d=h('div','val');d.appendChild(chev());return d})(),()=>K.toast('Player profiles are coming soon!'));
const con=K.button('green_sm','Connect',()=>K.toast('Saving to the cloud is coming soon!'),{shine:1,delay:'1.6s'});
row(s2,'ic_cloud_up','Save Progress',con);
row(s2,'ic_globe','Language',val('English'),()=>K.toast('More languages are coming soon!'));
// Help & Info
const s3=section('Help & Info');const c3=card(s3);const hp=h('div','helps',c3);
for(const [ic,lb,m] of [['ic_help','Help & Support','Help & Support is coming soon!'],['ic_shield','Privacy & Terms','Privacy & Terms are coming soon!']]){
 const b=h('div','k-pill k-btn k-in',hp);b.style.setProperty('--i',ri++);img(ic,'ic',b);const s=h('span','',b);s.textContent=lb;K.press(b,()=>K.toast(m))}
const ver=h('div','k-in',c3);ver.id='ver';ver.textContent='Version 1.0.0';ver.style.setProperty('--i',ri++);
// layout: title on the fence rail, panel between the fence and the menu
function layout(I){const f=I.sy(FENCE);K.fitPanel(panel,title,I,f+10*I.wu,f-30*I.wu)}
K.start();
</script><script src="../nav/nav.js?v=7" data-page=""></script><script>window.BA&&BA.music("inside_myself")</script></body></html>
