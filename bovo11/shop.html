<script src="../uikit/kit.js?v=8"></script>
<script>
'use strict';
const IW=852,IH=1846;
const ui=K.scene('shop/bg.jpg?v=3',IW,IH,layout);
const {h,img}=K;
K.topbar(ui,'settings.html');
const title=h('div','k-title pg k-drop',ui);title.textContent='Shop';title.style.setProperty('--i',1);
const col=h('div','',ui);col.id='col';
let ri=0;const seq=(el,c='k-in')=>{el.classList.add(c);el.style.setProperty('--i',ri++);return el};
const buy=()=>K.toast('Purchases are coming soon!');
// bundle: Rambo + the bunny
const bd=seq(h('div','cd bund',col),'k-pop');const art=h('img','art',bd);art.src='shop/bundle.webp?v=2';
K.press(art,()=>{});
const rt=h('div','rt',bd);h('div','t1',rt).innerHTML='Best Friend<br>Bundle';h('div','t2',rt).innerHTML='2,500 Bones +<br>Boosters';
rt.appendChild(K.button('green_big','$4.99',buy,{shine:1,delay:'1s'}));
// bones
const three=h('div','three',col);
for(const [ic,n,p] of [['ic_bones_s','100 Bones','$0.99'],['ic_bones_m','550 Bones','$4.99'],['ic_bones_l','1,200 Bones','$9.99']]){
 const c=seq(h('div','cd bn',three));img(ic,'pic',c);h('div','nm',c).textContent=n;c.appendChild(K.button('green_sm',p,buy,{shine:1,delay:(2+ri*.3)+'s'}))}
// boosters
const bs=seq(h('div','bsec',col));h('div','k-plate',bs).textContent='Boosters';const bc=h('div','cd',bs);const row=h('div','bst',bc);
for(const [ic,price,name,bk] of [['bst_paw',50,'Paw Tap',0],['bst_swap',70,'Free Swap',1],['bst_bomb',90,'Bomb',2]]){
 const d=h('div','',row);const p=img(ic,'pic',d);
 const wob=()=>{p.classList.remove('wob');void p.offsetWidth;p.classList.add('wob')};p.onclick=wob;
 const b=K.button('green_sm','',()=>{wob();if(!window.Eco)return;if(!Eco.spend(price)){K.toast('You need '+price+' bones. You have '+Eco.bones()+'.');return}Eco.addBoost(bk,1);K.toast(name+' added! You have '+Eco.boosts()[bk]+'.')},{aria:'Buy one '+name+' for '+price+' bones'});img('ic_bone','b',b);h('div','k-lbl',b).textContent=price;d.appendChild(b)}
// restore
const rs=seq(h('div','k-pill k-btn rest',col));h('span','',rs).textContent='Restore Purchases';K.press(rs,()=>K.toast('Nothing to restore yet.'));
function layout(I){const y0=I.wu*198;K.fitPanel(col,title,I,y0,y0-58*I.wu)}
K.start();
</script><script src="../nav/nav.js?v=6" data-page="shop"></script><script>window.BA&&BA.music("inside_myself")</script></body></html>
