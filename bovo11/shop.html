<script src="../uikit/kit.js?v=22"></script>
<script>
'use strict';
const IW=852,IH=1846;
const ui=K.scene('shop/bg.jpg?v=3',IW,IH,layout);
const {h}=K;
K.topbar(ui,'settings.html');
const S=window.GBBStore,E=window.Eco,A='../uikit/',B5='shop5/',RB='shop5/rambo_bunny.webp?v=1';
const ART={s:'bones_s',m:'bones_m',l:'bones_l',g:'gold_pile'},bart=k=>B5+ART[k]+'.webp?v=3';
const BI=['bst_paw','bst_swap','bst_bomb','bst_shuffle'],BN=['Paw Tap','Free Swap','Bomb','Shuffle'];
const TONE={weekly:'gold',daily:'peach','gbb.bundle.starter':'sage','gbb.bundle.goodboy':'lilac','gbb.bundle.topdog':'honey'};
const BART={'gbb.deal.weekly':'s','gbb.deal.daily':'l','gbb.bundle.starter':'m','gbb.bundle.goodboy':'l','gbb.bundle.topdog':'g'},PART={100:'s',330:'m',600:'m',1300:'l',2800:'l',7500:'g'};
const sc=h('div','',ui);sc.id='shopScroll';const col=h('div','',sc);col.id='col';
const fmtN=n=>n.toLocaleString('en-US');
const img=(src,p,cls)=>{const i=h('img',cls||'',p);i.src=src;i.alt='';i.draggable=false;return i};
// press feel shared by every button: sink while held, act on release
function tap(el,fn){el.setAttribute('role','button');el.tabIndex=0;let d=false;
 el.addEventListener('pointerdown',()=>{d=true;el.classList.add('dn');K.buzz(8)});
 const up=go=>{if(!d)return;d=false;el.classList.remove('dn');if(go){try{BA.play('tap',{gap:60})}catch(e){}fn()}};
 el.addEventListener('pointerup',()=>up(true));el.addEventListener('pointerleave',()=>up(false));el.addEventListener('pointercancel',()=>up(false));
 el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});return el}
function piece(p,kind,v){const d=h('div','pc',p);
 if(kind==='bones'){img(bart(v.art),d);h('span','',d).textContent=fmtN(v.n)}
 if(kind==='boost'){const g=h('div','bset',d);BI.forEach(b=>img(A+b+'.webp?v=1',g));h('span','',d).textContent='×'+v}
 if(kind==='hearts'){const f=h('div','inf',d);img(A+'ic_heart.webp?v=1',f);h('span','',f).textContent='∞';h('span','',d).textContent=S.dur(v)}}
function buyBtn(p,prod,card){const b=h('div','buy',p);b.textContent=prod.price;b.setAttribute('aria-label','Buy '+(prod.name||fmtN(prod.bones)+' bones')+' for '+prod.price);
 tap(b,()=>{if(S.busy)return;b.classList.add('busy');b.textContent='…';
  S.buy(prod.id,(ok,pp,msg)=>{b.classList.remove('busy');b.textContent=prod.price;
   if(ok){card.classList.remove('got');void card.offsetWidth;card.classList.add('got');try{BA.play('win',{gap:200})}catch(e){}
    const bits=[];if(pp.bones)bits.push(fmtN(pp.bones)+' bones');if(pp.boost)bits.push(pp.boost+' of each booster');if(pp.hearts)bits.push(S.dur(pp.hearts)+' unlimited hearts');
    K.toast('Added: '+bits.join(', ')+'!');setTimeout(render,700)}
   else if(msg)K.toast(msg)})});return b}
function offer(prod){const k=prod.kind==='bundle'?'bundle':prod.kind;const c=h('article','deal '+(TONE[prod.kind]||TONE[prod.id])+' '+k,col);
 const hd=h('div','dh',c);h('h3','',hd).textContent=prod.name;
 if(prod.kind==='weekly')h('span','tag',hd).textContent='50% OFF';if(prod.kind==='daily')h('span','tag',hd).textContent='POPULAR';
 const ins=h('div','inset',c);
 if(prod.bones)piece(ins,'bones',{n:prod.bones,art:BART[prod.id]});
 if(prod.boost)piece(ins,'boost',prod.boost);if(prod.hearts)piece(ins,'hearts',prod.hearts);
 const f=h('div','df',c);
 if(prod.kind==='daily'){const t=h('span','fine',f);t.dataset.daily=1;t.textContent='Ends in '+S.fmt(S.dailyLeft())}
 if(S.bought(prod.id)){const b=h('div','buy off',f);b.dataset.id=prod.id;b.textContent=(prod.kind==='daily'?'New deal in ':'Back in ')+S.fmt(prod.kind==='daily'?S.dailyLeft():S.weeklyLeft())}
 else buyBtn(f,prod,c)}
function hero(prod){const c=h('article','deal peach hero',col);img(RB,c,'art');
 const r=h('div','cp',c);h('h3','',r).textContent=prod.name;h('div','bn',r).textContent=fmtN(prod.bones)+' Bones';
 const l1=h('div','ln',r);const g=h('div','bset',l1);BI.forEach(b=>img(A+b+'.webp?v=1',g));h('span','',l1).textContent='×'+prod.boost;
 const l2=h('div','ln',r);const f=h('div','inf',l2);img(A+'ic_heart.webp?v=1',f);h('span','',f).textContent='∞';h('span','',l2).textContent=S.dur(prod.hearts);
 if(S.bought(prod.id))h('div','buy off',r).textContent='Bought!';else buyBtn(r,prod,c)}
function hdr(t){h('div','hdr',col).textContent=t}
function render(){const y=sc.scrollTop;col.textContent='';
 h('div','ttl',col).textContent='Shop';
 const P=S.products;
 hero(P.find(p=>p.id==='gbb.bundle.bestfriend'));
 hdr('Deals');offer(P.find(p=>p.kind==='weekly'));offer(P.find(p=>p.kind==='daily'));
 hdr('Bundles');P.filter(p=>p.kind==='bundle'&&p.id!=='gbb.bundle.bestfriend').forEach(offer);
 hdr('Bone Packs');const g=h('div','grid',col);
 for(const p of P.filter(p=>p.kind==='bones')){const t=h('article','pack',g);img(bart(PART[p.bones]),t);h('b','',t).textContent=fmtN(p.bones);buyBtn(t,p,t)}
 hdr('Boosters');const bg=h('div','boos',col);
 BI.forEach((b,k)=>{const t=h('article','boo',bg);const pic=img(A+b+'.webp?v=1',t);h('b','',t).textContent=BN[k];
  const price=E.PRICE.boost[k];const btn=h('div','buy',t);img(A+'gold_bone.webp?v=1',btn);h('span','',btn).textContent=price;btn.setAttribute('aria-label','Buy one '+BN[k]+' for '+price+' bones');
  let lock=false;tap(btn,()=>{if(lock)return;lock=true;setTimeout(()=>lock=false,400);   // no double charge on a double tap
   if(!E.spend(price)){K.toast('You need '+price+' bones. You have '+E.bones()+'.');return}
   E.addBoost(k,1);pic.classList.remove('wob');void pic.offsetWidth;pic.classList.add('wob');K.toast(BN[k]+' added! You have '+E.boosts()[k]+'.')})});
 const r=h('div','restore',col);r.textContent='Restore Purchases';tap(r,()=>S.restore());
 sc.scrollTop=y}
S.onChange=render;render();
setInterval(()=>{col.querySelectorAll('[data-daily]').forEach(e=>e.textContent='Ends in '+S.fmt(S.dailyLeft()));
 col.querySelectorAll('.buy.off').forEach(e=>{const p=S.byId(e.dataset.id);if(!S.bought(p.id))return render();e.textContent=(p.kind==='daily'?'New deal in ':'Back in ')+S.fmt(p.kind==='daily'?S.dailyLeft():S.weeklyLeft())})},30000);
function layout(I){Object.assign(sc.style,{top:'0px',height:innerHeight+'px',zIndex:4});col.style.paddingTop=(I.wu*118)+'px';col.style.paddingBottom=(innerHeight-I.navTop+18*I.wu)+'px'}
K.start();
</script><script src="../nav/nav.js?v=23" data-page="shop"></script><script>window.BA&&BA.music("inside_myself")</script></body></html>
