const SH={
 full8:['.......','.......','.......','.......','.......','.......','.......','.......'],
 full9:['.......','.......','.......','.......','.......','.......','.......','.......','.......'],

 seats:['.......','.......','x.....x','x.....x','x.....x','x.....x','.......','.......'],
 split:['.......','.......','...x...','...x...','...x...','.......','.......','.......'],
 hour:['.......','x.....x','xx...xx','xx...xx','x.....x','.......','.......','.......'],
 ring:['.......','.......','..xxx..','..x.x..','..xxx..','.......','.......','.......'],
 frame:['x.....x','.......','.x...x.','.......','.......','.x...x.','.......','x.....x'],

function genLevels(){
 const L=[];let seed=1;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};
 const put=(rows,r,c,ch)=>{if(rows[r]&&rows[r][c]==='.')rows[r]=rows[r].slice(0,c)+ch+rows[r].slice(c+1)};
 const pick=a=>a[Math.floor(rnd()*a.length)];
 const ORDER=['collect','dig','crates','drop','shape','tied','digdrop','cratetied','mix','boss'];
 for(let ch=0;ch<CH.length;ch++)for(let j=0;j<10;j++){
  seed=ch*1000+j*37+11;rnd();
  const h=Math.min(ch,4),T=ORDER[j];let shape,goals=[],moves,carrots=0;
  if(T=='collect'){shape=ch==0?'full8':pick(['full8','corners','hour','tower']);const a=Math.floor(rnd()*5);const b=(a+1+Math.floor(rnd()*4))%5;const n=ch==0?12:16+3*h;goals=[{k:'piece',t:a,n},{k:'piece',t:b,n}];moves=ch==0?22:22+Math.floor(h/2)}
  else if(T=='dig'){shape=ch<2?'full8':pick(['full8','corners']);moves=ch==0?28:30+h}
  else if(T=='crates'){shape=ch==0?'full8':pick(['full8','full9']);moves=24}
  else if(T=='drop'){shape=ch==0?'full8':pick(['full8','corners']);carrots=2+(h>=4?1:0);moves=ch==0?28:30+h}
  else if(T=='shape'){shape=ch==0?'plus':pick(['plus','diamond','seats','split','ring','frame','stairs']);const a=Math.floor(rnd()*5);goals=[{k:'piece',t:a,n:ch==0?18:20+2*h}];moves=25}
  else if(T=='tied'){shape=ch==0?'full8':pick(['full8','full9','tower']);moves=20+(ch==0?2:0)}
  else if(T=='digdrop'){shape='full8';carrots=2;moves=ch==0?36:34}
  else if(T=='cratetied'){shape=pick(['full8','full9']);moves=34}
  else if(T=='mix'){shape=ch==0?'hour':pick(['corners','full8','hour']);moves=30}
  else{shape='full9';carrots=2;moves=33+2*h+(ch>=5?5:0)}
  const rows=SH[shape].slice();
  if(rows.length<9){let best=-1,bd=99;for(let i=1;i<rows.length;i++){if(rows[i-1]=='.......'&&rows[i]=='.......'&&Math.abs(i-4)<bd){bd=Math.abs(i-4);best=i}}rows.splice(best<0?rows.length:best,0,'.......')}
  const R=rows.length;
  if(T=='dig'||T=='digdrop'||T=='mix'||T=='boss'){
   const k=(T=='dig'&&h>=2)?2:1;
   for(let r=R-k;r<R;r++)for(let c=0;c<7;c++)put(rows,r,c,(h>=2&&T=='boss'&&r==R-1)||(h>=4&&T=='dig'&&r==R-1&&c%2==0)?'L':'S');
   if(T=='dig'&&h>=4)[[R-3,0],[R-3,6],[R-3,3]].forEach(([r,c])=>put(rows,r,c,'S'));
  }
  if(T=='crates'||T=='cratetied'||(T=='mix'&&ch>0)){
   const pat=ch==0?'block':pick(['block','ring','sides','stripe']);const dbl=h>=1&&rnd()<.35+h*.15;const C=dbl?'D':'C';
   if(pat=='block'){for(let r=2;r<=4;r++)for(let c=1;c<=5;c++)put(rows,r,c,(r==3&&dbl)?'D':'C')}
   else if(pat=='ring'){for(let c=1;c<=5;c++){put(rows,2,c,'C');put(rows,5,c,'C')}put(rows,3,1,C);put(rows,4,1,C);put(rows,3,5,C);put(rows,4,5,C)}
   else if(pat=='sides'){for(let r=2;r<=5;r++){put(rows,r,0,'C');put(rows,r,1,C);put(rows,r,5,C);put(rows,r,6,'C')}}
   else{for(let c=0;c<7;c+=2)put(rows,3,c,c%4?C:'C');for(let c=1;c<6;c++)put(rows,R-1,c,'C')}
  }
  if(T=='mix'&&ch==0){[[4,2],[4,3],[4,4]].forEach(([r,c])=>put(rows,r,c,'C'))}
  if(T=='tied'||T=='cratetied'||T=='boss'||(T=='mix'&&h>=2)){
   const r0=T=='cratetied'?R-3:3;
   if(T=='boss')[[3,0],[3,3],[3,6]].forEach(([r,c])=>put(rows,r,c,'T'));
   else if(T=='mix')[[1,1],[1,5]].forEach(([r,c])=>put(rows,r,c,'T'));
   else{for(let c=0;c<7;c+=2)put(rows,r0,c,'T');if(h>=1||T=='tied')for(let c=1;c<7;c+=2)put(rows,r0+1,c,'T')}
  }
  if(T=='boss'&&h>=1){put(rows,5,1,'D');put(rows,5,5,'D')}
  if(T=='boss'&&h>=3){put(rows,2,2,'D');put(rows,2,4,'D')}
  if(carrots){const cols=[1,5,3].slice(0,carrots);cols.forEach(c=>{for(let r=0;r<R;r++){if(rows[r][c]=='.'){put(rows,r,c,'K');break}}})}
  const cnt=chs=>rows.join('').split('').filter(x=>chs.includes(x)).length;
  const nC=cnt('CD'),nS=cnt('SL'),nT=cnt('T'),nK=cnt('K');
  if(nS)goals.push({k:'dirt',n:nS});if(nC)goals.push({k:'crate',n:nC});if(nT)goals.push({k:'tied',n:nT});if(nK)goals.push({k:'carrot',n:nK});
  if(!goals.length)goals.push({k:'piece',t:Math.floor(rnd()*5),n:20});
  goals=goals.slice(0,3);
  if(['drop','digdrop','dig','boss'].includes(T))moves+=2;
  L.push({ch,j,type:T,rows,goals,moves});
 }
 return L}

function newState(li){
 const lv=LEVELS[li];const R=lv.rows.length;
 const st={li,lv,R,cells:[],moves:lv.moves,score:0,goals:lv.goals.map(g=>({...g,left:g.n})),busy:false,over:false,combo:0,sel:null,booster:-1,exits:[]};
 for(let r=0;r<R;r++){st.cells.push([]);for(let c=0;c<COLS;c++){const ch=lv.rows[r][c];
  if(ch=='x'){st.cells[r].push(null);continue}
  const cell={r,c,p:null,b:null,ch};
  if(ch=='C')cell.b={k:'crate',hp:1};if(ch=='D')cell.b={k:'crate',hp:2};
  if(ch=='S')cell.b={k:'dirt',hp:1};if(ch=='L')cell.b={k:'dirt',hp:2};
  st.cells[r].push(cell)}}

  // carrots reaching exit
  for(let c=0;c<COLS;c++){const r=S.exits[c];if(r==null)continue;const cell=S.cells[r][c];if(cell&&cell.p&&cell.p.carrot){const p=cell.p;cell.p=null;p.el.style.transition='transform .3s,opacity .3s';p.el.style.opacity=0;p.el.style.transform+=' translateY(30px)';setTimeout(()=>p.el.remove(),320);goalHit('carrot',0,cell);addScore(500);any=true;fx('special')}}
  if(any)await wait(20)}
 // seal-off failsafe: any empty cell that can't be reached gets a fresh piece
 const holes=allCells().filter(c=>!isStatic(c)&&!c.p);
 if(holes.length){holes.forEach(c=>{const p=makePiece(Math.floor(Math.random()*5));pieceEl(p);setPos(p,c.r,c.c);c.p=p;p.cell=c;if(!FAST)p.el.animate([{opacity:0,transform:p.el.style.transform+' scale(.2)'},{opacity:1,transform:p.el.style.transform}],{duration:250})});await wait(250)}
 drawExits()}

// ================= turn flow =================
async function resolve(swapCells=[]){
 S.combo=0;
 while(true){
  S.tag=(S.tag||0)+1;
  const groups=findGroups();
  if(!groups.length&&!FQ.length){if(allCells().some(c=>!c.b&&!c.p)){await gravity();if(allCells().some(c=>!c.b&&!c.p)&&findGroups().length==0)break;continue}break}
  if(groups.length){
   S.combo++;snd('pop',S.combo);
   for(const g of groups){
    let pos=g.cells.find(x=>swapCells.includes(x))||g.cells[Math.floor(g.cells.length/2)];
    if(g.sp&&pos.p&&pos.p.tied)pos=g.cells.find(x=>x.p&&!x.p.tied)||null;
    // neighbors blockers
    const nb=new Set();g.cells.forEach(x=>[[0,1],[0,-1],[1,0],[-1,0]].forEach(([a,b])=>{const n=cellAt(x.r+a,x.c+b);if(n&&n.b)nb.add(n)}));
    g.cells.forEach(x=>damage(x));nb.forEach(n=>damage(n));
    const [cx,cy]=center(g.cells[Math.floor(g.cells.length/2)]);floater(cx,cy-10,'+'+g.cells.length*60*(1+(S.combo-1)*.5|0));
    if(g.sp&&pos&&!pos.p&&!pos.b){fx('special');if(Math.random()<.2)fx('rambo_bark2',{delay:.25,gap:9000});const p=makePiece(-1,{sp:g.sp});pieceEl(p);setPos(p,pos.r,pos.c);pos.p=p;p.cell=pos;p.el.animate([{transform:p.el.style.transform+' scale(0)'},{transform:p.el.style.transform+' scale(1.3)'},{transform:p.el.style.transform}],{duration:FAST?1:300})}
   }
   if(S.combo==3){say(pick(['Good boy!','Woof!','Pawsome!']));fx('voice_m6',{delay:.1,gap:9000})}
   if(S.combo==5)fx('rambo_double',{delay:.1,gap:4000});
   if(S.combo>=4)comboText(S.combo>=6?'BOBO-TASTIC!':S.combo>=5?'PAWSOME!':'GOOD BOY!');
  }
  await wait(200);
  if(FQ.length){await fireAll();await wait(120)}
  swapCells=[];
  await gravity();
 }}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function comboText(t){if(FAST)return;const d=document.createElement('div');d.className='combo cream f';d.textContent=t;app.appendChild(d);setTimeout(()=>d.remove(),1050);$('rb').classList.remove('wag');void $('rb').offsetWidth;$('rb').classList.add('wag')}
async function trySwap(a,b,free=false){
 if(S.busy||S.over)return;
 const mov=x=>x&&!x.b&&x.p&&!x.p.tied;if(!mov(a)||!mov(b))return;
 S.busy=true;clearSel();hintStop();
 const pa=a.p,pb=b.p;snd('swap');
 a.p=pb;b.p=pa;pa.cell=b;pb.cell=a;setPos(pa,b.r,b.c,160);setPos(pb,a.r,a.c,160);await wait(170);
 let used=false;
 if(pa.sp||pb.sp){used=true;if(!free)useMove();await special2(b,a,pa,pb);await resolve([])}
 else if(localMatch(a)||localMatch(b)){used=true;if(!free)useMove();await resolve([a,b])}
 else{snd('bad');a.p=pa;b.p=pb;pa.cell=a;pb.cell=b;setPos(pa,a.r,a.c,160);setPos(pb,b.r,b.c,160);await wait(170)}
 S.busy=false;if(used)await endTurn()}
async function special2(ca,cb,pa,pb){ // pa now at ca, pb at cb
 S.tag++;
 const sa=pa.sp,sb=pb.sp;
 if(sa&&sb){
  const both=[sa,sb].sort().join('+');
  ca.p=null;cb.p=null;pa.dying=pb.dying=true;popEl(pa);popEl(pb);comboText('MEGA COMBO!');fx('mega');fx('rambo_triple',{delay:.35,gap:3000});
  if(both=='rainbow+rainbow'){ring(cb,500);shake(8);for(const x of allCells())x.b?damage(x):damage(x);await wait(150)}
  else if(sa=='rainbow'||sb=='rainbow'){const other=sa=='rainbow'?sb:sa;const t=mostCommon();await rainbowClear(cb,t,other=='row'||other=='col'?'line':other)}
  else if((sa=='row'||sa=='col')&&(sb=='row'||sb=='col')){await fire({sp:'row'},cb,{keepEl:1});await fire({sp:'col'},cb,{keepEl:1})}
  else if(both.includes('bomb')&&(both.includes('row')||both.includes('col'))){for(const d of [-1,0,1]){const rr=cellAt(cb.r+d,cb.c)||{r:cb.r+d,c:cb.c};const cc={r:cb.r,c:cb.c+d};
    beam({r:cb.r+d,c:cb.c},'row');beam({r:cb.r,c:cb.c+d},'col');for(let k=0;k<COLS;k++)damage(cellAt(cb.r+d,k));for(let k=0;k<S.R;k++)damage(cellAt(k,cb.c+d))}await wait(150)}
  else if(both=='bomb+bomb'){ring(cb,360);shake(8);areaBomb(cb.r,cb.c,3).forEach(x=>damage(x));await wait(150)}
  else if(both.includes('flyer')){const other=sa=='flyer'?sb:sa;if(other=='flyer'){for(let i=0;i<3;i++)await fire({sp:'flyer'},cb,{keepEl:1})}else await fire({sp:'flyer'},cb,{keepEl:1,carry:other})}
  await fireAll();return}
 const sp=sa?pa:pb,cell=sa?ca:cb,other=sa?pb:pa;
 sp.dying=true;cell.p=null;
 if(sp.sp=='rainbow'){const t=colorOf(other);popEl(sp);await rainbowClear(cell,t>=0?t:mostCommon())}
 else await fire(sp,cell);
 await fireAll()}
async function tapSpecial(cell){if(S.busy||S.over)return;const p=cell.p;S.busy=true;clearSel();hintStop();useMove();S.tag++;p.dying=true;cell.p=null;await fire(p,cell);await fireAll();await resolve([]);S.busy=false;await endTurn()}
function useMove(){S.moves--;drawMoves()}
async function endTurn(){
 if(S.over)return;
 if(S.goals.every(g=>g.left<=0)){await win();return}
 if(S.moves<=0){lose();return}
 if(S.moves==5){say('Almost there!');fx('lowmoves')}
 if(!findMove()){await shuffle();}
 hintArm()}
async function shuffle(){S.busy=true;toast('No moves! Shuffling…');await wait(600);
 const cs=allCells().filter(c=>!c.b&&c.p&&!c.p.tied&&!c.p.carrot&&!c.p.sp);
 for(let k=0;k<80;k++){const ps=cs.map(c=>c.p);for(let i=ps.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ps[i],ps[j]]=[ps[j],ps[i]]}
  cs.forEach((c,i)=>{c.p=ps[i];ps[i].cell=c});if(!findGroups().length&&findMove())break}
 cs.forEach(c=>setPos(c.p,c.r,c.c,350));await wait(380);S.busy=false}

// ================= HUD =================

function goalImg(g){return g.k=='piece'?PIMG[g.t]:g.k=='crate'?'ob_crate':g.k=='dirt'?'ob_dirt':g.k=='tied'?'ob_leash':'ob_carrot'}

const STARSVG='<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 1.8l3.1 6.6 7.1.8-5.3 4.9 1.5 7.1L12 17.6 5.6 21.2l1.5-7.1L1.8 9.2l7.1-.8z" stroke="#6a3612" stroke-width="2" stroke-linejoin="round"/><path d="M12 4.5l2.2 4.6 4.9.6" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.4" stroke-linecap="round"/></svg>';

let bubT;function say(t){if(FAST)return;const b=$('bub');b.textContent=t;b.classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove('on'),1800)}

// ================= input =================
let down=null;
function cellFromPt(e){const rc=board.getBoundingClientRect();const k=rc.width/(COLS*CS);const x=(e.clientX-rc.left)/k,y=(e.clientY-rc.top)/k;const c=Math.floor(x/CS),r=Math.floor(y/CS);return cellAt(r,c)}
board.addEventListener('pointerdown',e=>{if(!S||S.busy||S.over)return;const cell=cellFromPt(e);if(!cell)return;try{board.setPointerCapture(e.pointerId)}catch(_){}down={cell,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};hintStop()});
addEventListener('pointercancel',()=>{down=null});
document.addEventListener('touchmove',e=>{if(e.touches.length<2)e.preventDefault()},{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('pointermove',e=>{if(!down||down.moved||S.booster>=0)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;const k=board.getBoundingClientRect().width/(COLS*CS);if(Math.hypot(dx,dy)<16*k)return;
 down.moved=true;const a=down.cell;const b=Math.abs(dx)>Math.abs(dy)?cellAt(a.r,a.c+Math.sign(dx)):cellAt(a.r+Math.sign(dy),a.c);if(b)trySwap(a,b)});
addEventListener('pointerup',e=>{if(!down)return;const d=down;down=null;if(d.moved)return;tapCell(d.cell)});
async function tapCell(cell){
 if(S.booster>=0){const k=S.booster;
  if(k==0){if(!cell.p&&!cell.b)return;boosterDone();S.busy=true;S.tag++;ring(cell,70);damage(cell);await fireAll();await resolve([]);S.busy=false;await endTurn()}
  else if(k==2){boosterDone();S.busy=true;S.tag++;await fire({sp:'bomb'},cell,{keepEl:1});await fireAll();await resolve([]);S.busy=false;await endTurn()}
  else if(k==1){if(!cell.p||cell.p.tied||cell.b)return;if(!S.bsel){S.bsel=cell;cell.p.el.classList.add('sel');return}
   const a=S.bsel;a.p&&a.p.el.classList.remove('sel');if(Math.abs(a.r-cell.r)+Math.abs(a.c-cell.c)!=1){S.bsel=cell;cell.p.el.classList.add('sel');return}
   boosterDone();S.bsel=null;S.busy=true;const pa=a.p,pb=cell.p;a.p=pb;cell.p=pa;pa.cell=cell;pb.cell=a;setPos(pa,cell.r,cell.c,160);setPos(pb,a.r,a.c,160);await wait(170);
   if(pa.sp||pb.sp){await special2(cell,a,pa,pb)}await resolve([a,cell]);S.busy=false;await endTurn()}
  return}
 if(!cell.p||cell.b||cell.p.tied)return;
 if(S.sel){const a=S.sel;if(a===cell){if(cell.p.sp){tapSpecial(cell)}else clearSel();return}
  if(Math.abs(a.r-cell.r)+Math.abs(a.c-cell.c)==1){trySwap(a,cell);return}}

async function win(){S.over=true;S.busy=true;clearTimeout(hintT);say('We did it!');comboText('LEVEL CLEAR!');fx('win');fx('rambo_double',{delay:1.1});fx('voice_m9',{delay:2.3});await wait(900);
