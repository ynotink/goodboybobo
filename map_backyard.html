<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Good Boy Bobo · Backyard rolling map (preview)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0f5;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

</style></head><body>
<canvas id="sky"></canvas><canvas id="gl"></canvas><canvas id="obj"></canvas>
<div id="fixed"></div>
<div id="dbg"><div id="info"></div><button id="bBack">▼ Back</button><button id="bFwd">▲ Forward</button><button id="bRambo">Go to Rambo</button><button id="bWin">✓ Win level</button><button id="bReset">Reset</button></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
//  GOOD BOY BOBO — MAP MOVEMENT PROTOTYPE (temporary art, not live)
//  World units: 1290 = phone width. s = distance along the world (up).
//  Route repeats: A (right start) → crossing → B (left start) → crossing.
// =====================================================================
const WV=1290, SA=2600, SX=1100, L=2*(SA+SX), LOOPS=3, TOT=L*LOOPS;
const SEC=[{n:'A',len:SA},{n:'X1',len:SX},{n:'B',len:SA},{n:'X2',len:SX}];
const SECBASE=[0,SA,SA+SX,2*SA+SX];
const ss=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function secAt(s){const m=((s%L)+L)%L;let i=3;for(let j=0;j<4;j++)if(m<SECBASE[j]+SEC[j].len){i=j;break}return{i,loc:m-SECBASE[i],loop:Math.floor(s/L)}}
function cross(loc,a,b){const m=(a+b)/2;if(loc<400)return a+(m-a)*ss(loc/400);if(loc<700)return m;return m+(b-m)*ss((loc-700)/400)}
function routeX(s){const {i,loc}=secAt(s);
 if(i==0)return 645+255*Math.cos(2*Math.PI*loc/SA);   // starts right (900), swings left, back right
 if(i==2)return 645-255*Math.cos(2*Math.PI*loc/SA);   // starts left (390), swings right, back left
 if(i==1)return cross(loc,900,390);                    // crossing right → left over the bridge
 return cross(loc,390,900);}                           // crossing left → right
const rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

// ---------------- levels (5 per A/B section) ----------------
const LEVELS=[];
for(let k=0;k<LOOPS;k++)[0,2].forEach((si,h)=>{for(let j=0;j<5;j++){const s=k*L+SECBASE[si]+350+j*500;LEVELS.push({L:k*10+h*5+j+1,s,x:routeX(s)})}});
// Rambo & friends: world anchors for a level (only change when a level is won)
function anchors(lv){const m=LEVELS[lv-1],side=m.x>645?-1:1;return{
 rambo:{x:m.x+side*235,s:m.s-40},bunny:{x:m.x+side*415,s:m.s-5},cardinal:{x:m.x+side*330,s:m.s-150},buck:{x:m.x-side*300,s:m.s+170},face:side}}
const KEY='gbb_proto_cur';let cur=Math.max(1,Math.min(LEVELS.length,+(localStorage.getItem(KEY)||3)));

// ---------------- Backyard props (ChatGPT batch 1 sprites) ----------------
const BB='a/mapbb2/',PW={ball:[150,150],bench:[360,220],birdbath:[240,330],bowl:[180,110],bridge_post_left:[90,260],bridge_post_right:[90,260],bush_flowers:[340,210],doghouse:[460,430],family_house:[900,760],fence:[520,220],flowers:[300,190],garden_light:[110,380],rock:[260,160],shed:[520,500],swing:[500,520],tree_big:[480,680],tree_round:[420,580],tree_small:[300,420],wheelbarrow:[300,200]};
const MULCH={0:[[1956,1343],[2229,349],[556,1366],[371,882]],1:[[440,726]],2:[[2262,661],[332,1845],[529,493],[279,1043]],3:[[2115,557]]};
const PIMG={};for(const n in PW){PIMG[n]=new Image();PIMG[n].src=BB+n+'.webp'}
const PROPS=[];
(function(){const all=[];for(let lv=1;lv<=LEVELS.length;lv++){const a=anchors(lv);['rambo','bunny','cardinal','buck'].forEach(k=>all.push({...a[k],r:k=='buck'?170:140}))}
 const ok=(x,s,w)=>{const rx=routeX(s);if(Math.abs(x-rx)<200+w*0.5+20)return false;
  if(all.some(p=>Math.abs(p.x-x)<p.r+w*0.5&&Math.abs(p.s-s)<170))return false;
  if(LEVELS.some(m=>Math.abs(m.x-x)<170+w*0.5&&Math.abs(m.s-s)<160))return false;
  if(PROPS.some(p=>Math.abs(p.x-x)<(p.w+w)*0.45&&Math.abs(p.s-s)<110))return false;
  const {i,loc}=secAt(s);if(loc<160||loc>SEC[i].len-160)return false;if(i%2==1&&loc>420&&loc<690)return false;return x>-560&&x<1850};
 const add=(n,x,s)=>{const [w,h]=PW[n];if(ok(x,s,w)){PROPS.push({type:n,x,s,w,h});return true}return false};
 const near=(n,side,b,s0,s1,maxOff)=>{const w=PW[n][0];for(let s=s0;s<=s1;s+=40)for(let o=0;o<=(maxOff||500);o+=40){const x=routeX(b+s)+side*(225+w/2+o);if(add(n,x,b+s))return true}return false};
 const force=(n,x,s)=>{const [w,h]=PW[n];PROPS.push({type:n,x,s,w,h})};
 const nearChar=(x,s,w)=>all.some(p=>Math.abs(p.x-x)<p.r+w*0.4&&Math.abs(p.s-s)<150);
 for(let k=0;k<LOOPS;k++)for(let si=0;si<4;si++){const r=rng(k*31+si*7+5),base=k*L+SECBASE[si],len=SEC[si].len;
  // trees on the mulch rings ChatGPT painted (template px → world)
  MULCH[si].forEach(([tx,ty],j)=>{const x=tx-645,s=base+len-ty,n=['tree_big','tree_round','tree_small','tree_big'][j%4];if(!nearChar(x,s,PW[n][0]))force(n,x,s)});
  if(si==0){near('doghouse',1,base,300,700);near('bowl',1,base,250,750,200);near('family_house',1,base,1700,2300,300);near('swing',-1,base,1500,2200);near('bench',-1,base,900,1400);near('ball',-1,base,700,1100,300);near('garden_light',1,base,1200,1500,60)}
  if(si==2){near('shed',-1,base,400,900);near('wheelbarrow',-1,base,1000,1400);near('birdbath',1,base,1300,1700);near('bench',1,base,1900,2300);near('garden_light',-1,base,1600,1900,60)}
  if(si%2==1){[['bridge_post_left',430,415],['bridge_post_right',860,415],['bridge_post_left',430,685],['bridge_post_right',860,685]].forEach(([n,x,y])=>force(n,x,base+len-y));
   add('flowers',si==1?1000:250,base+250);add('bush_flowers',si==1?240:1050,base+850);add('rock',si==1?900:350,base+780)}
  if(si%2==0)for(let x=-500;x<1850;x+=470)add('fence',x,base+len-230);
  const fill=['bush_flowers','flowers','rock','tree_small','bush_flowers','flowers'];
  for(let loc=200;loc<len-180;loc+=170)for(const side of[-1,1])for(let tries=0;tries<3;tries++){const s2=base+loc+r()*80,rx=routeX(s2),n=fill[Math.floor(r()*fill.length)],x=rx+side*(240+PW[n][0]/2+r()*650);if(add(n,x,s2))break}}
})();

// ---------------- drum camera (curved ground + open sky) ----------------
let k,Hv,y0,D,R,AT,cam=0,DPR=1;const AMIN=-0.25,X0=-645,XW=2580;
function tang(){let a=0,b=Math.PI;for(let i=0;i<60;i++){const m=(a+b)/2,f=y0*Math.sin(m)+R-(R+D)*Math.cos(m);if(f<0)a=m;else b=m}return(a+b)/2}
function projA(x,al){const X=x-645,Y=y0+R*Math.sin(al),Z=-R*(1-Math.cos(al)),sc=D/(D-Z);return{px:innerWidth/2+X*sc*k,py:innerHeight/2-Y*sc*k,sc,al}}
function proj(x,s){return projA(x,(s-cam)/R)}
function geom(){k=innerWidth/WV;Hv=WV*innerHeight/innerWidth;y0=-Hv/2-80;D=1.15*Hv;
 const want=Hv/2-Hv*0.30;let lo=Hv*0.2,hi=Hv*60;
 for(let i=0;i<70;i++){R=(lo+hi)/2;AT=tang();const p=projA(645,AT),yw=(innerHeight/2-p.py)/k;if(yw>want)hi=R;else lo=R}
 R=(lo+hi)/2;AT=tang()}
const horizonPx=()=>projA(645,AT).py;

// ---------------- WebGL ground ----------------
const glc=document.getElementById('gl'),gl=glc.getContext('webgl2',{antialias:true,premultipliedAlpha:false});
const VS=`#version 300 es
in vec2 p;uniform float R,D,y0,Hv,W,AT,AMIN,cam,X0,XW,LL;out vec2 vT;out float vA;
void main(){float a=mix(AMIN,AT,p.y);float x=X0-1290.0+p.x*(XW+2580.0);float X=x-W*0.5;float Y=y0+R*sin(a);float Z=-R*(1.0-cos(a));float sc=D/(D-Z);
 gl_Position=vec4(X*sc/(W*0.5),Y*sc/(Hv*0.5),0.0,1.0);vT=vec2((x-X0)/XW,cam+a*R);vA=(a-AMIN)/(AT-AMIN);}`;
const FS=`#version 300 es
precision highp float;in vec2 vT;in float vA;uniform sampler2D tA,tX,tB,tY;uniform float LL,SA,SX;out vec4 o;
void main(){float m=mod(vT.y,LL);float u=vT.x;vec4 c;
 if(m<SA){c=texture(tA,vec2(u,1.0-m/SA));}
 else if(m<SA+SX){c=texture(tX,vec2(u,1.0-(m-SA)/SX));}
 else if(m<2.0*SA+SX){c=texture(tB,vec2(u,1.0-(m-SA-SX)/SA));}
 else{c=texture(tY,vec2(u,1.0-(m-2.0*SA-SX)/SX));}float h=smoothstep(0.80,1.0,vA);c.rgb=mix(c.rgb,vec3(0.74,0.88,0.93),h*0.45);c.rgb*=mix(1.0,0.86,smoothstep(0.93,1.0,vA));o=vec4(c.rgb,1.0);}`;
function shd(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
const pr=gl.createProgram();gl.attachShader(pr,shd(gl.VERTEX_SHADER,VS));gl.attachShader(pr,shd(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const NX=48,NY=220,vv=[];for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const x0=i/NX,x1=(i+1)/NX,a0=j/NY,a1=(j+1)/NY;vv.push(x0,a0,x1,a0,x1,a1,x0,a0,x1,a1,x0,a1)}
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vv),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
function loadTex(unit,src,cb){const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);
 gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.MIRRORED_REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
 const an=gl.getExtension('EXT_texture_filter_anisotropic');if(an)gl.texParameterf(gl.TEXTURE_2D,an.TEXTURE_MAX_ANISOTROPY_EXT,8);cb&&cb()};im.src=src}
let TEXN=0;['A','X1','B','X2'].forEach((n,i)=>loadTex(i,BB+'ground_'+n+'.webp',()=>TEXN++));
gl.uniform1i(U('tA'),0);gl.uniform1i(U('tX'),1);gl.uniform1i(U('tB'),2);gl.uniform1i(U('tY'),3);

// ---------------- sky ----------------
const sky=document.getElementById('sky'),sg=sky.getContext('2d');
const SKY=new Image();SKY.src=BB+'sky.webp';const FAR=new Image();FAR.src=BB+'far_strip.webp';
function drawSky(){const w=innerWidth,h=innerHeight;sg.setTransform(DPR,0,0,DPR,0,0);sg.fillStyle='#7fcff4';sg.fillRect(0,0,w,h);
 if(SKY.complete)sg.drawImage(SKY,0,0,w,1400*k);
 const hy=horizonPx();if(FAR.complete){const fw=1290*k*1.2,fh=fw*400/2580*1.0,off=((cam*0.06*k)%fw+fw)%fw;for(let x=-off;x<w;x+=fw)sg.drawImage(FAR,x,hy-fh+6*k,fw,fh)}}
// ---------------- images (approved characters + markers) ----------------
const IM={};['L08_rambo','L07_bunny','L09_cardinal','L06_buck'].forEach(n=>{IM[n]=new Image();IM[n].src='a/home/'+n+'.webp'});
['completed','current','locked'].forEach(n=>{IM['mk_'+n]=new Image();IM['mk_'+n].src='a/world/marker_'+n+'_grounded.webp'});
IM.star=new Image();IM.star.src='a/map2/star_gold_512.webp';
const fontP=new FontFace('BoboNunito','url(a/home/Nunito-Black.ttf)',{weight:'900'}).load().then(f=>{document.fonts.add(f)}).catch(()=>{});

// ---------------- characters (world-anchored) ----------------
const CHAR={rambo:['L08_rambo',709,1121,380],bunny:['L07_bunny',282,538,330],cardinal:['L09_cardinal',250,336,180],buck:['L06_buck',370,729,470]};
let pos=anchors(cur),move=null;
function setCur(n,animate){const from=pos,to=anchors(n);cur=n;localStorage.setItem(KEY,cur);
 if(!animate){pos=to;return}move={from,to,t0:performance.now(),dur:1500}}
function stepMove(t){if(!move)return;const u=Math.min(1,(t-move.t0)/move.dur),e=ss(u);const p={face:move.to.face};
 for(const n in CHAR){const a=move.from[n],b=move.to[n];p[n]={x:a.x+(b.x-a.x)*e,s:a.s+(b.s-a.s)*e,hop:n=='rambo'?Math.abs(Math.sin(u*Math.PI*4))*40*(1-u):0}}
 pos=p;if(u>=1){pos=move.to;move=null}}

// ---------------- objects pass (depth-sorted, horizon-occluded) ----------------
const obc=document.getElementById('obj'),og=obc.getContext('2d');let HITS=[];
function squash(x,s){const a=proj(x,s),b=proj(x,s+40);return Math.max(0.08,Math.min(1.05,(a.py-b.py)/(40*a.sc*k)))}
function drawObjects(){og.setTransform(DPR,0,0,DPR,0,0);og.clearRect(0,0,innerWidth,innerHeight);HITS=[];
 const items=[],aMax=AT+0.45,aMin=-0.35;
 const vis=s=>{const al=(s-cam)/R;return al>aMin&&al<aMax};
 PROPS.forEach(p=>{if(vis(p.s))items.push({s:p.s,kind:'prop',p})});
 LEVELS.forEach(m=>{if(vis(m.s))items.push({s:m.s,kind:'mk',m})});
 for(const n in CHAR){const a=pos[n];if(a&&vis(a.s))items.push({s:a.s,kind:'ch',n,a})}
 items.sort((A,B)=>B.s-A.s);const hz=horizonPx();
 for(const it of items){const x=it.kind=='prop'?it.p.x:it.kind=='mk'?it.m.x:it.a.x,q=proj(x,it.s);
  og.save();if(q.al>AT-0.002){og.beginPath();og.rect(0,0,innerWidth,hz);og.clip()}
  const f=q.sc*k,sq=squash(x,it.s);
  if(it.kind=='prop'){const p=it.p,w=p.w*f,h=p.h*f;og.fillStyle='rgba(20,40,10,.32)';og.beginPath();og.ellipse(q.px+w*0.08,q.py,w*0.42,w*0.42*sq*0.35,0,0,7);og.fill();if(PIMG[p.type].complete)og.drawImage(PIMG[p.type],q.px-w/2,q.py-h,w,h)}
  else if(it.kind=='ch'){const [img,iw,ih,hh]=CHAR[it.n],h=hh*f,w=iw/ih*h,hop=(it.a.hop||0)*f;
   og.fillStyle='rgba(20,35,8,.38)';og.beginPath();og.ellipse(q.px,q.py,w*0.38,w*0.38*sq*0.3,0,0,7);og.fill();
   const flip=(it.n=='buck'?-1:1)*pos.face<0;og.translate(q.px,q.py-hop);if(flip)og.scale(-1,1);if(IM[img].complete)og.drawImage(IM[img],-w/2,-h,w,h)}
  else{const m=it.m,kind=m.L<cur?'completed':m.L==cur?'current':'locked',W=300*f,img=IM['mk_'+kind];
   og.translate(q.px,q.py);og.scale(W/512,W/512*sq*0.8);
   if(kind=='current'){const gl2=0.5+0.5*Math.sin(performance.now()/260);og.fillStyle=`rgba(190,255,110,${0.25+0.25*gl2})`;og.beginPath();og.ellipse(0,0,250,200,0,0,7);og.fill()}
   if(img.complete)og.drawImage(img,-256,-205,512,512);
   og.fillStyle='#fff';og.strokeStyle=kind=='locked'?'#1d2a2a':kind=='current'?'#0d5a12':'#063D35';og.lineJoin='round';og.lineWidth=18;og.textAlign='center';og.textBaseline='middle';
   og.font=`900 ${kind=='locked'?120:150}px BoboNunito, system-ui`;const ty=kind=='completed'?-45:-20;og.strokeText(m.L,0,ty);og.fillText(m.L,0,ty);
   if(kind=='completed'&&IM.star.complete)[[-85,85],[0,97],[85,85]].forEach(([sx,sy])=>og.drawImage(IM.star,sx-46,sy-46,92,92));
   HITS.push({L:m.L,kind,x:q.px,y:q.py,r:W*0.45})}
  og.restore()}}

// ---------------- approved UI overlay (unchanged art) ----------------
const fixed=document.getElementById('fixed');
const put=(src,x,y,w,h)=>{const i=new Image();i.src=src;Object.assign(i.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});fixed.appendChild(i);return i};
function label(txt,st,fs,x,y,w,h){const c=document.createElement('canvas'),r=Math.max(2,devicePixelRatio||1);c.width=w*r;c.height=h*r;Object.assign(c.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});fixed.appendChild(c);
 fontP.then(()=>{const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);let f=fs;g.font=`900 ${f}px BoboNunito`;while(f>16&&g.measureText(txt).width>w*.86){f--;g.font=`900 ${f}px BoboNunito`}
  const m=g.measureText(txt),by=h/2+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2;g.textAlign='center';g.lineJoin='round';g.lineWidth=f*st.ow;g.strokeStyle=st.ol;g.strokeText(txt,w/2,by);g.fillStyle=st.fill;g.fillText(txt,w/2,by)});return c}
let BT=[],BN='',UIREADY=false;
function banner(name){if(!UIREADY||name===BN)return;BN=name;BT.forEach(c=>c.remove());const kk=1100/1290;
 BT=[label(name,{fill:'#FFF5DE',ol:'#003C32',ow:.12},114*kk,95+127*kk,330+83*kk,1036*kk,151*kk),label('Backyard preview',{fill:'#FFF5DE',ol:'#003C32',ow:.12},70*kk,95+442*kk,330+287*kk,406*kk,102*kk)]}
fetch('a/home/layers.json').then(r=>r.json()).then(m=>{
 for(const n of['L02_heart_counter','L03_bone_counter','L04_gear'])put('a/home/'+n+'.webp',...m[n]);
 put('a/map2/chapter_banner_blank_1290x500.webp',95,330,1100,1100*500/1290);
 put('a/home/L13_bottom_bar.webp',...m.L13_bottom_bar);const t=m.L14_active_home_tile;put('a/home/L14_active_home_tile.webp',t[0]+258,t[1],t[2],t[3]);
 ['L15_nav_home','L16_nav_map','L17_nav_toys','L18_nav_friends','L19_nav_shop'].forEach(n=>put(n=='L16_nav_map'?'a/map2/nav_map_teal.webp':'a/home/'+n+'.webp',...m[n]));
 label('5',{fill:'#006368',ol:'#003E42',ow:.04},84,215,229,86,96);label('430',{fill:'#006368',ol:'#003E42',ow:.04},84,603,229,237,96);UIREADY=true;fitUI()});
function fitUI(){const S=innerWidth/1290,fh=innerHeight/S;fixed.style.transform=`scale(${S})`;fixed.style.height=fh+'px';const off=fh-2796;
 fixed.querySelectorAll('img,canvas').forEach(e=>{if(e.dataset.by===undefined)e.dataset.by=parseFloat(e.style.top);const by=+e.dataset.by;if(by>=2400)e.style.top=(by+off)+'px'})}

// ---------------- camera input (camera only; never moves characters) ----------------
const clampC=s=>Math.max(-300,Math.min(TOT-2600,s));
let drag=null,vel=0,glide=null;
function camFor(sTarget){return clampC(sTarget-0.30*Hv)}
function glideTo(s){glide={from:cam,to:clampC(s),t0:performance.now(),dur:700};vel=0}
function down(x,y,t){drag={x,y,c0:cam,t,moved:0};vel=0;glide=null}
function mv(x,y,t){if(!drag)return;drag.moved=Math.max(drag.moved,Math.hypot(x-drag.x,y-drag.y));const nc=clampC(drag.c0+(y-drag.y)/k),dt=Math.max(8,t-(drag.lt||drag.t));vel=0.7*vel+0.3*(nc-cam)/dt;drag.lt=t;cam=nc}
function up(x,y){if(!drag)return;const d=drag;drag=null;if(d.moved<10){vel=0;const h=HITS.find(h=>Math.hypot(h.x-x,h.y-y)<h.r);if(h)toast(h.kind=='locked'?`Level ${h.L} is locked`:`Level ${h.L}`)}}
if(window.PointerEvent){obc.addEventListener('pointerdown',e=>{obc.setPointerCapture(e.pointerId);down(e.clientX,e.clientY,e.timeStamp)});
 obc.addEventListener('pointermove',e=>mv(e.clientX,e.clientY,e.timeStamp));obc.addEventListener('pointerup',e=>up(e.clientX,e.clientY));obc.addEventListener('pointercancel',e=>up(-1e4,-1e4))}
else{obc.addEventListener('touchstart',e=>{const t=e.touches[0];down(t.clientX,t.clientY,e.timeStamp)},{passive:true});
 obc.addEventListener('touchmove',e=>{const t=e.touches[0];mv(t.clientX,t.clientY,e.timeStamp)},{passive:true});obc.addEventListener('touchend',e=>{const t=e.changedTouches[0];up(t.clientX,t.clientY)})}
document.addEventListener('touchmove',e=>{if(!e.target.closest('button'))e.preventDefault()},{passive:false});
addEventListener('wheel',e=>{cam=clampC(cam-e.deltaY);vel=0;e.preventDefault()},{passive:false});
document.getElementById('bFwd').onclick=()=>glideTo(cam+1300);
document.getElementById('bBack').onclick=()=>glideTo(cam-1300);
document.getElementById('bRambo').onclick=()=>glideTo(camFor(pos.rambo.s));
document.getElementById('bWin').onclick=()=>{if(move||cur>=LEVELS.length)return;setCur(cur+1,true);glideTo(camFor(LEVELS[cur-1].s))};
document.getElementById('bReset').onclick=()=>{setCur(3,false);glideTo(camFor(pos.rambo.s))};
let tt;function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,1000)}

// ---------------- frame loop ----------------
function resize(){DPR=Math.min(3,devicePixelRatio||1);for(const c of[glc,sky,obc]){c.width=Math.round(innerWidth*DPR);c.height=Math.round(innerHeight*DPR)}gl.viewport(0,0,glc.width,glc.height);geom();fitUI()}
addEventListener('resize',resize);resize();
const secName=s=>'THE BACKYARD';
let lastT=performance.now();
function frame(t){const dt=Math.min(50,t-lastT);lastT=t;
 if(glide){const u=Math.min(1,(t-glide.t0)/glide.dur);cam=glide.from+(glide.to-glide.from)*ss(u);if(u>=1)glide=null}
 else if(!drag&&Math.abs(vel)>0.01){cam=clampC(cam+vel*dt);vel*=Math.pow(0.996,dt)}
 stepMove(t);
 gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
 [['R',R],['D',D],['y0',y0],['Hv',Hv],['W',WV],['AT',AT],['AMIN',AMIN],['cam',cam],['X0',X0],['XW',XW],['LL',L],['SA',SA],['SX',SX]].forEach(([n,v])=>gl.uniform1f(U(n),v));
 gl.drawArrays(gl.TRIANGLES,0,NX*NY*6);drawSky();drawObjects();
 const mid=cam+0.45*Hv,si=secAt(mid);banner(secName(mid));
 document.getElementById('info').textContent=`camera ${Math.round(cam)} · ${SEC[si.i].n} ${Math.round(si.loc)}/${SEC[si.i].len} · loop ${si.loop+1} · Rambo at level ${cur}`;
 requestAnimationFrame(frame)}
cam=camFor(pos.rambo.s);window.PROTO={get cam(){return cam},set cam(v){cam=clampC(v);vel=0;glide=null},proj,get pos(){return pos},LEVELS,L,SECBASE,setCur,get cur(){return cur}};
requestAnimationFrame(frame);
</script></body></html>
