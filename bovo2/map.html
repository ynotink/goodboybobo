<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Good Boy Bobo · Map</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0f5;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#sky,#gl,#obj{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#obj{touch-action:none}
#fixed{position:fixed;left:0;top:0;width:1290px;height:2796px;transform-origin:0 0;pointer-events:none}
#fixed img,#fixed canvas{position:absolute;display:block}
#dbg{position:fixed;left:6px;right:6px;bottom:calc(27vw + 6px + env(safe-area-inset-bottom));display:flex;gap:5px;flex-wrap:wrap;justify-content:center;z-index:10;pointer-events:none}
#dbg button{pointer-events:auto;font:700 12px system-ui;padding:7px 9px;border-radius:9px;border:0;background:rgba(0,48,52,.85);color:#fff}
#info{width:100%;text-align:center;font:600 11px system-ui;color:#fff;text-shadow:0 1px 2px #000}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font:700 14px system-ui;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:11}
#dbg{display:none}body.debug #dbg{display:flex}</style><style>
#levelModal{position:fixed;inset:0;z-index:40;background:#003f4677;backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;touch-action:auto}
#levelModal.open{display:flex}.levelCard{position:relative;width:min(78vw,400px);padding:32px 22px 24px;text-align:center;border:5px solid #fff9df;border-radius:35px;background:linear-gradient(#fff9e8,#ffe5b1);box-shadow:0 8px 0 #bd9347,0 22px 60px #003a4988;color:#00636a;font-family:BoboNunito,system-ui}.levelCard h2{font-size:32px;margin:5px}.levelCard p{font-size:17px}.levelCard img{height:160px;max-width:100%;object-fit:contain}.levelCard button{font:900 20px BoboNunito,system-ui;cursor:pointer;border:2px solid #e9ffb3;border-radius:22px;background:linear-gradient(#9eff24,#21c900);color:white;text-shadow:0 2px #185e15;padding:14px 32px;box-shadow:0 5px #138e05}.levelCard .close{position:absolute;right:10px;top:8px;padding:4px 12px;font-size:22px;background:#00747b;box-shadow:none;border:0}.demoNote{font:12px system-ui;opacity:.7;margin-top:18px}
</style><style>#loading{position:fixed;inset:0;display:grid;place-items:center;background:#0c6970;color:#fff8de;font:800 18px system-ui;z-index:99}#loading[hidden]{display:none}#reviewPanel{position:fixed;z-index:90;left:4px;right:4px;top:4px;max-height:48px;overflow:auto;display:flex;flex-wrap:wrap;gap:2px;background:#00363ed9}#reviewPanel[hidden]{display:none}#reviewPanel button{font:9px system-ui;padding:3px;color:#fff;background:#00686c;border:1px solid #a5d2cc}body.review #dbg{display:none}</style></head><body>
<div id="levelModal" role="dialog" aria-modal="true" aria-label="Level preview"><div class="levelCard"><button class="close" aria-label="Close">×</button><h2 id="levelTitle">Level 2</h2><img src="" alt="Bobo"><p>The Backyard</p><button id="previewWin">Complete preview level</button><div class="demoNote">Map preview · sample progression</div></div></div><canvas id="sky"></canvas><canvas id="gl"></canvas><canvas id="obj"></canvas>
<div id="fixed"></div>
<div id="dbg"><div id="info"></div><button id="bBack">▼ Back</button><button id="bFwd">▲ Forward</button><button id="bRambo">Go to Rambo</button><button id="bWin">✓ Win level</button><button id="bReset">Reset</button></div>
<div id="toast"></div>
<div id="loading">Opening the map…</div><div id="reviewPanel" hidden></div><pre id="diagnostics" hidden></pre>
<script src="../audio.js?v=23"></script><script src="../common.js?v=23"></script><div id="app" style="display:none"></div>
<script src="chapter-backyard.js"></script><script src="chapter-neighborhood.js"></script><script src="ground-renderer.js"></script><script src="map.js"></script><script>window.BA&&BA.music&&BA.music("Theme")</script></body></html>
